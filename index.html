      function chartGeometry(forecast, extraValues = []) {
        const width = 900;
        const height = 350;
        const left = 82;
        const right = 25;
        const top = 24;
        const bottom = 52;
        const values = forecast.days.map(day => day.closingBalanceCents).concat([forecast.cushionCents, 0, forecast.startingBalanceCents], extraValues);
        let minimum = Math.min(...values);
        let maximum = Math.max(...values);
        if (minimum === maximum) {
          const padding = Math.max(10000, Math.abs(minimum) * .2);
          minimum -= padding;
          maximum += padding;
        } else {
          const padding = Math.max(1000, (maximum - minimum) * .12);
          minimum -= padding;
          maximum += padding;
        }
        const roughStep = (maximum - minimum) / 4;
        const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
        const normalized = roughStep / magnitude;
        const niceFactor = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
        const tickStep = niceFactor * magnitude;
        minimum = Math.floor(minimum / tickStep) * tickStep;
        maximum = Math.ceil(maximum / tickStep) * tickStep;
        const ticks = [];
        for (let value = maximum; value >= minimum - tickStep / 2; value -= tickStep) ticks.push(Math.round(value));
        const plotWidth = width - left - right;
        const plotHeight = height - top - bottom;
        const x = index => left + (forecast.days.length === 1 ? plotWidth / 2 : index * plotWidth / (forecast.days.length - 1));
        const y = cents => top + (maximum - cents) * plotHeight / (maximum - minimum);
        return { width, height, left, right, top, bottom, plotWidth, plotHeight, minimum, maximum, ticks, x, y };
      }

      function forecastChartMarkup(forecast) {
        const g = chartGeometry(forecast);
        const path = forecast.days.map((day, index) => (index ? "L" : "M") + g.x(index).toFixed(2) + " " + g.y(day.closingBalanceCents).toFixed(2)).join(" ");
        const yGrid = g.ticks.map(value => '<g><line x1="' + g.left + '" x2="' + (g.width - g.right) + '" y1="' + g.y(value).toFixed(2) + '" y2="' + g.y(value).toFixed(2) + '" stroke="#D7DFD3"/><text x="' + (g.left - 11) + '" y="' + (g.y(value) + 4).toFixed(2) + '" text-anchor="end" fill="#587067" font-size="12">' + formatChartMoney(value) + '</text></g>').join("");
        const xIndexes = [...new Set([0, Math.floor((forecast.days.length - 1) / 2), forecast.days.length - 1])];
        const xLabels = xIndexes.map(index => '<text x="' + g.x(index).toFixed(2) + '" y="' + (g.height - 18) + '" text-anchor="' + (index === 0 ? "start" : index === forecast.days.length - 1 ? "end" : "middle") + '" fill="#587067" font-size="12">' + formatShortDate(forecast.days[index].date) + '</text>').join("");
        const cushionY = g.y(forecast.cushionCents);
        const zeroY = g.y(0);
        const lowestDayIndex = Math.max(0, forecast.days.findIndex(day => day.date === forecast.lowest.date && day.closingBalanceCents === forecast.lowest.balanceCents));
        const lowestX = g.x(lowestDayIndex);
        const lowestY = g.y(forecast.lowest.balanceCents);
        let shortfallMarker = "";
        if (forecast.firstBelowZero) {
          const matchedIndex = forecast.days.findIndex(day => day.date === forecast.firstBelowZero.date && day.closingBalanceCents < 0);
          const shortfallIndex = Math.max(0, matchedIndex);
          const sx = g.x(shortfallIndex);
          const sy = g.y(matchedIndex < 0 ? forecast.firstBelowZero.balanceCents : forecast.days[shortfallIndex].closingBalanceCents);
          shortfallMarker = '<path d="M ' + sx + ' ' + (sy - 7) + ' L ' + (sx + 7) + ' ' + sy + ' L ' + sx + ' ' + (sy + 7) + ' L ' + (sx - 7) + ' ' + sy + ' Z" fill="#9A3E35" stroke="#FFFDF7" stroke-width="2"><title>First negative balance on ' + formatDate(forecast.firstBelowZero.date) + '</title></path>';
        }
        const initialIndex = Math.min(forecast.days.length - 1, Math.max(0, state.forecastInspectIndex));
        const inspectX = g.x(initialIndex);
        const inspectY = g.y(forecast.days[initialIndex].closingBalanceCents);
        return '<svg id="balance-chart" class="balance-chart" viewBox="0 0 ' + g.width + ' ' + g.height + '" role="img" tabindex="0" aria-labelledby="chart-title chart-description" data-left="' + g.left + '" data-right="' + g.right + '" data-width="' + g.width + '"><title id="chart-title">Daily closing balance forecast</title><desc id="chart-description">Use the pointer or the left and right arrow keys to inspect daily closing balances. The complete values are also available in the table below.</desc><rect width="' + g.width + '" height="' + g.height + '" rx="12" fill="#FFFDF7"/>' + yGrid + '<line x1="' + g.left + '" x2="' + (g.width - g.right) + '" y1="' + cushionY.toFixed(2) + '" y2="' + cushionY.toFixed(2) + '" stroke="#EDAA87" stroke-width="2" stroke-dasharray="7 6"/><text x="' + (g.width - g.right - 4) + '" y="' + (cushionY - 7).toFixed(2) + '" text-anchor="end" fill="#7B422D" font-size="12" font-weight="700">Cushion ' + formatMoney(forecast.cushionCents) + '</text><line x1="' + g.left + '" x2="' + (g.width - g.right) + '" y1="' + zeroY.toFixed(2) + '" y2="' + zeroY.toFixed(2) + '" stroke="#9A3E35" stroke-width="2" stroke-dasharray="3 6"/><text x="' + (g.left + 5) + '" y="' + (zeroY - 7).toFixed(2) + '" fill="#9A3E35" font-size="12" font-weight="700">Zero</text><path d="' + path + '" fill="none" stroke="#173F35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + lowestX + '" cy="' + lowestY + '" r="7" fill="#EDAA87" stroke="#173F35" stroke-width="3"><title>Lowest balance ' + formatMoney(forecast.lowest.balanceCents) + ' on ' + formatDate(forecast.lowest.date) + '</title></circle>' + shortfallMarker + '<line id="inspect-line" x1="' + inspectX + '" x2="' + inspectX + '" y1="' + g.top + '" y2="' + (g.height - g.bottom) + '" stroke="#24584A" stroke-width="1.5" opacity=".42"/><circle id="inspect-point" cx="' + inspectX + '" cy="' + inspectY + '" r="6" fill="#FFFDF7" stroke="#24584A" stroke-width="3"/>' + xLabels + '</svg>';
      }

      function dailyBalanceTableMarkup(forecast) {
        const rows = forecast.days.map(day => '<tr><td>' + formatDate(day.date) + '</td><td>' + formatMoney(day.openingBalanceCents) + '</td><td>+' + formatMoney(day.incomeCents) + '</td><td>−' + formatMoney(day.expenseCents) + '</td><td class="' + (day.closingBalanceCents < 0 ? "negative" : "") + '">' + formatMoney(day.closingBalanceCents) + '</td></tr>').join("");
        return '<details class="daily-details"><summary>View accessible daily-balance table</summary><div class="table-wrap"><table class="balance-table"><caption class="sr-only">Daily opening balances, income, expenses, and closing balances</caption><thead><tr><th scope="col">Date</th><th scope="col">Opening</th><th scope="col">Income</th><th scope="col">Expenses</th><th scope="col">Closing</th></tr></thead><tbody>' + rows + '</tbody></table></div></details>';
      }

      function forecastMarkup() {
        const forecast = calculateForecast(state.plan, state.forecastHorizon, state.forecastIncomeMode);
        const cushionCopy = forecast.firstBelowCushion ? (forecast.firstBelowCushion.isStartingBalance ? "Already below at the start · " : "First below · ") + formatDate(forecast.firstBelowCushion.date) : "Stays at or above the cushion";
        const zeroCopy = forecast.firstBelowZero ? (forecast.firstBelowZero.isStartingBalance ? "Already negative at the start · " : "First below zero · ") + formatDate(forecast.firstBelowZero.date) : "No negative balance projected";
        const lowestCopy = (forecast.lowest.isStartingBalance ? "Starting balance · " : "First reached · ") + formatDate(forecast.lowest.date);
        const initialIndex = Math.min(forecast.days.length - 1, Math.max(0, state.forecastInspectIndex));
        const initialDay = forecast.days[initialIndex];
        const transactionSummary = forecast.transactions.length ? forecast.transactions.length + " dated transaction" + (forecast.transactions.length === 1 ? "" : "s") + " included" : "No transactions fall in this horizon";
        const chartSummary = forecast.firstBelowZero ? '⚠ The forecast first falls below zero on <strong>' + formatDate(forecast.firstBelowZero.date) + '</strong>.' : forecast.firstBelowCushion ? '⚠ The forecast falls below your cushion on <strong>' + formatDate(forecast.firstBelowCushion.date) + '</strong>, but does not fall below zero.' : '✓ The forecast stays at or above your cushion through <strong>' + formatDate(forecast.endDate) + '</strong>.';
        return '<div class="page"><header class="page-header"><div><p class="eyebrow">Payday forecast · ' + formatDate(forecast.startDate) + '–' + formatDate(forecast.endDate) + '</p><h1>See when money gets tight.</h1><p class="lede">A day-by-day estimate from the transactions in your money plan.</p></div><div class="forecast-controls" aria-label="Forecast options"><div class="control-group" aria-label="Forecast length">' + [30,60,90].map(days => '<button class="control-button' + (state.forecastHorizon === days ? " active" : "") + '" type="button" data-horizon="' + days + '" aria-pressed="' + (state.forecastHorizon === days) + '">' + days + ' days</button>').join("") + '</div><div class="control-group" aria-label="Income confidence"><button class="control-button' + (state.forecastIncomeMode === "expected" ? " active" : "") + '" type="button" data-income-mode="expected" aria-pressed="' + (state.forecastIncomeMode === "expected") + '">Expected</button><button class="control-button' + (state.forecastIncomeMode === "confirmed" ? " active" : "") + '" type="button" data-income-mode="confirmed" aria-pressed="' + (state.forecastIncomeMode === "confirmed") + '">Confirmed only</button></div></div></header><section class="grid forecast-summary" aria-label="Forecast summary"><article class="card summary-card' + (forecast.lowest.balanceCents < 0 ? " danger" : forecast.lowest.balanceCents < state.plan.cushionCents ? " warning" : "") + '"><div class="summary-label">Lowest projected balance</div><div class="summary-value">' + formatMoney(forecast.lowest.balanceCents) + '</div><p class="summary-help">' + lowestCopy + '</p></article><article class="card summary-card' + (forecast.firstBelowCushion ? " warning" : "") + '"><div class="summary-label">' + (forecast.firstBelowCushion ? '<span class="warning-label"><span class="warning-icon" aria-hidden="true">!</span>Cushion check</span>' : "Cushion check") + '</div><div class="summary-value">' + (forecast.firstBelowCushion ? formatShortDate(forecast.firstBelowCushion.date) : "Clear") + '</div><p class="summary-help">' + cushionCopy + '</p></article><article class="card summary-card' + (forecast.firstBelowZero ? " danger" : "") + '"><div class="summary-label">' + (forecast.firstBelowZero ? '<span class="warning-label"><span class="warning-icon" aria-hidden="true">!</span>Below zero</span>' : "Below zero") + '</div><div class="summary-value">' + (forecast.firstBelowZero ? formatShortDate(forecast.firstBelowZero.date) : "None") + '</div><p class="summary-help">' + zeroCopy + '</p></article><article class="card summary-card"><div class="summary-label">Additional spending room</div><div class="summary-value">' + formatMoney(forecast.additionalSpendingRoomCents) + '</div><p class="summary-help">Estimate through ' + formatDate(forecast.endDate) + '—not guaranteed money available to spend.</p></article></section><div class="forecast-layout"><div class="forecast-note"><span class="forecast-note-icon" aria-hidden="true">i</span><div><strong>' + (state.forecastIncomeMode === "expected" ? "Expected view includes confirmed and estimated income." : "Confirmed-only view excludes estimated income and keeps every expense.") + '</strong> Switching views does not change your saved entries. The starting balance is available before the first day’s transactions. Same-day income is assumed available before that day’s expenses; actual bank timing may differ. Your cushion is a comparison line, not an expense. Savings held outside your available balance is excluded.</div></div><section class="card chart-card" aria-labelledby="balance-chart-heading"><div class="chart-header"><div><p class="eyebrow">Daily closing balance</p><h2 id="balance-chart-heading">Balance over ' + state.forecastHorizon + ' days</h2></div><div class="chart-key" aria-hidden="true"><span class="key-item"><span class="key-line"></span>Closing balance</span><span class="key-item"><span class="key-line cushion"></span>Cushion</span><span class="key-item"><span class="key-line zero"></span>Zero</span></div></div><div class="chart-wrap">' + forecastChartMarkup(forecast) + '</div><p class="chart-summary" id="forecast-text-summary">' + chartSummary + ' ' + transactionSummary + '.</p><div id="chart-inspection" class="chart-inspection" aria-live="polite"><strong>' + formatDate(initialDay.date) + '</strong> · Daily closing balance <span>' + formatMoney(initialDay.closingBalanceCents) + '</span></div>' + dailyBalanceTableMarkup(forecast) + '</section><section class="card card-pad" aria-labelledby="upcoming-heading"><div class="section-head"><div><p class="eyebrow">Upcoming money</p><h2 id="upcoming-heading">Income and bills</h2><p>Chronological occurrences from your original entries.</p></div><button class="button secondary" type="button" data-view="plan">Edit money plan</button></div><div id="upcoming-list"></div></section><div class="callout"><p><strong>Check what is missing.</strong> This forecast uses only what you entered. Include groceries, transportation, and other everyday spending so the estimate is useful. Bluegrass Bloom does not invent living costs.</p></div></div>' + footerMarkup() + '</div>';
      }

      function renderUpcomingList() {
        const container = document.getElementById("upcoming-list");
        if (!container) return;
        const forecast = calculateForecast(state.plan, state.forecastHorizon, state.forecastIncomeMode);
        if (!forecast.transactions.length) {
          const empty = el("div", "forecast-empty");
          empty.append(el("h3", "", "No income or bills in this forecast"), el("p", "", state.forecastIncomeMode === "confirmed" && state.plan.incomes.some(item => item.status === "estimated") ? "Estimated income is hidden in this view. All expenses are still included." : "Add dated income and expenses to see money move across the forecast."));
          const button = el("button", "button primary", "Edit money plan");
          button.type = "button";
          button.dataset.view = "plan";
          empty.append(button);
          container.replaceChildren(empty);
          return;
        }
        const list = el("ol", "upcoming-list");
        forecast.transactions.forEach(transaction => {
          const row = el("li", "money-row");
          row.append(el("div", "money-date", formatDate(transaction.date)));
          const details = el("div");
          details.append(el("div", "money-description", transaction.label));
          const tags = el("div", "money-tags");
          tags.append(el("span", "tag", transaction.category));
          if (transaction.type === "income") tags.append(el("span", "tag " + (transaction.status === "estimated" ? "estimated" : ""), titleCase(transaction.status)));
          details.append(tags);
          const values = el("div", "money-values");
          values.append(el("span", "signed-amount " + transaction.type, (transaction.type === "income" ? "+" : "−") + formatMoney(transaction.amountCents)));
          const closing = el("span", "closing-label", "Daily closing balance ");
          closing.append(el("span", "closing-value" + (transaction.closingBalanceCents < 0 ? " negative" : ""), formatMoney(transaction.closingBalanceCents)));
          values.append(closing);
          const edit = el("button", "button ghost", "Edit original");
          edit.type = "button";
          if (transaction.transferToSavings) edit.dataset.editContribution = transaction.goalId + "|" + transaction.sourceId;
          else { edit.dataset.edit = transaction.type; edit.dataset.id = transaction.sourceId; }
          edit.setAttribute("aria-label", "Edit original entry for " + transaction.label);
          row.append(details, values, edit);
          list.append(row);
        });
        container.replaceChildren(list);
      }

      function updateChartInspection(index) {
        const forecast = calculateForecast(state.plan, state.forecastHorizon, state.forecastIncomeMode);
        const safeIndex = Math.min(forecast.days.length - 1, Math.max(0, index));
        state.forecastInspectIndex = safeIndex;
        const day = forecast.days[safeIndex];
        const g = chartGeometry(forecast);
        const point = document.getElementById("inspect-point");
        const line = document.getElementById("inspect-line");
        const inspection = document.getElementById("chart-inspection");
        if (!point || !line || !inspection) return;
        const x = g.x(safeIndex);
        point.setAttribute("cx", x);
        point.setAttribute("cy", g.y(day.closingBalanceCents));
        line.setAttribute("x1", x);
        line.setAttribute("x2", x);
        const strong = el("strong", "", formatDate(day.date));
        const value = el("span", "", formatMoney(day.closingBalanceCents));
        inspection.replaceChildren(strong, document.createTextNode(" · Daily closing balance "), value);
      }

      function setupForecastChart() {
        const chart = document.getElementById("balance-chart");
        if (!chart) return;
        const inspectPointer = event => {
          const rect = chart.getBoundingClientRect();
          const svgX = (event.clientX - rect.left) / rect.width * Number(chart.dataset.width);
          const left = Number(chart.dataset.left);
          const right = Number(chart.dataset.right);
          const plotWidth = Number(chart.dataset.width) - left - right;
          const ratio = Math.min(1, Math.max(0, (svgX - left) / plotWidth));
          updateChartInspection(Math.round(ratio * (state.forecastHorizon - 1)));
        };
        chart.addEventListener("pointermove", inspectPointer);
        chart.addEventListener("pointerdown", inspectPointer);
        chart.addEventListener("keydown", event => {
          let next = state.forecastInspectIndex;
          if (event.key === "ArrowLeft") next -= 1;
          else if (event.key === "ArrowRight") next += 1;
          else if (event.key === "Home") next = 0;
          else if (event.key === "End") next = state.forecastHorizon - 1;
          else return;
          event.preventDefault();
          updateChartInspection(next);
        });
      }

      function ensureScenarioDraft() {
        if (state.scenarioDraft) return;
        const saved = state.activeScenarioId ? state.plan.scenarios.find(scenario => scenario.id === state.activeScenarioId) : state.plan.scenarios[0];
        state.scenarioDraft = saved ? clonePlan(saved) : emptyScenario();
        state.activeScenarioId = saved ? saved.id : null;
        state.scenarioDraftBaseline = clonePlan(state.scenarioDraft);
        state.scenarioDraftDirty = false;
      }

      function scenarioEditingChange(type) {
        if (!state.scenarioEditingChangeId || !state.scenarioDraft) return null;
        return state.scenarioDraft.changes.find(change => change.id === state.scenarioEditingChangeId && change.type === type) || null;
      }

      function scenarioFormActions(type, editing) {
        return '<div class="scenario-form-actions"><button class="button primary" type="submit">' + (editing ? "Update change" : "Add change") + '</button>' + (editing ? '<button class="button secondary" type="button" data-scenario-cancel-edit="' + type + '">Cancel edit</button>' : "") + '</div>';
      }

      function scenarioChangeTitle(change) {
        if (change.type === "purchase") return "Purchase · " + change.description;
        if (change.type === "paycheck-change") return "Change paycheck amount";
        if (change.type === "paycheck-delay") return "Delay paycheck";
        if (change.type === "contribution-change") return "Change savings contribution";
        return "Change housing cost";
      }

      function scenarioChangeDetail(change) {
        if (change.type === "purchase") return formatMoney(change.amountCents) + " on " + formatDate(change.date);
        if (change.type === "paycheck-change") return formatDate(change.occurrenceDate) + " paycheck becomes " + formatMoney(change.amountCents);
        if (change.type === "paycheck-delay") return formatDate(change.occurrenceDate) + " moves to " + formatDate(change.newDate);
        if (change.type === "contribution-change") return formatDate(change.occurrenceDate) + " transfer becomes " + formatMoney(change.amountCents);
        return "Your share becomes " + formatMoney(change.amountCents) + " from " + formatDate(change.effectiveDate) + (change.movingCostCents ? " · " + formatMoney(change.movingCostCents) + " moving cost" : "");
      }

      function comparisonMetricRows(forecast, baseline = null) {
        const delta = (value, base, suffix = "") => {
          if (base === null || value === base) return "";
          const difference = value - base;
          return '<span class="metric-delta">' + (difference > 0 ? "+" : "−") + (suffix ? Math.abs(difference) + " " + suffix : formatMoney(Math.abs(difference))) + '</span>';
        };
        const base = baseline || forecast;
        const firstCushion = forecast.firstBelowCushion ? formatShortDate(forecast.firstBelowCushion.date) : "None";
        const firstZero = forecast.firstBelowZero ? formatShortDate(forecast.firstBelowZero.date) : "None";
        return '<dl class="metric-list"><div class="metric-row"><dt>Lowest balance</dt><dd>' + formatMoney(forecast.lowest.balanceCents) + '<span class="metric-delta">' + formatDate(forecast.lowest.date) + '</span>' + delta(forecast.lowest.balanceCents, base.lowest.balanceCents) + '</dd></div><div class="metric-row"><dt>First below cushion</dt><dd>' + firstCushion + '</dd></div><div class="metric-row"><dt>First below zero</dt><dd>' + firstZero + '</dd></div><div class="metric-row"><dt>Days below cushion</dt><dd>' + forecast.daysBelowCushion + delta(forecast.daysBelowCushion, base.daysBelowCushion, "days") + '</dd></div><div class="metric-row"><dt>Ending balance</dt><dd>' + formatMoney(forecast.endingBalanceCents) + delta(forecast.endingBalanceCents, base.endingBalanceCents) + '</dd></div></dl>';
      }

      function deterministicResultMarkup(comparison) {
        const baseline = comparison.baseline;
        const scenario = comparison.scenario;
        const statements = [];
        const minimumDifference = scenario.lowest.balanceCents - baseline.lowest.balanceCents;
        const onlyPurchase = state.scenarioDraft.changes.length === 1 && state.scenarioDraft.changes[0].type === "purchase";
        if (minimumDifference < 0) statements.push((onlyPurchase ? "This purchase" : "This decision") + " lowers your minimum balance by " + formatMoney(Math.abs(minimumDifference)) + ".");
        else if (minimumDifference > 0) statements.push("This decision raises your minimum balance by " + formatMoney(minimumDifference) + ".");
        else statements.push("This decision does not change the minimum balance within this forecast.");
        if (scenario.firstBelowCushion) {
          if (!baseline.firstBelowCushion) statements.push("Your plan would fall below its cushion on " + formatDate(scenario.firstBelowCushion.date) + ".");
          else if (scenario.firstBelowCushion.date !== baseline.firstBelowCushion.date) statements.push("The cushion breach moves from " + formatDate(baseline.firstBelowCushion.date) + " to " + formatDate(scenario.firstBelowCushion.date) + ".");
          else statements.push("The plan already falls below its cushion on " + formatDate(baseline.firstBelowCushion.date) + "; this decision does not change that first date.");
        } else if (baseline.firstBelowCushion) statements.push("The current plan falls below its cushion, while this scenario does not within the selected period.");
        const baselineBelowZero = baseline.lowest.balanceCents < 0;
        const scenarioBelowZero = scenario.lowest.balanceCents < 0;
        if (scenarioBelowZero && !baselineBelowZero) statements.push("This decision creates a shortfall, reaching " + formatMoney(scenario.lowest.balanceCents) + ".");
        else if (!scenarioBelowZero && baselineBelowZero) statements.push("The current plan falls below zero, while this scenario stays at or above zero.");
        else if (scenarioBelowZero && baselineBelowZero) statements.push("Both versions fall below zero: the current plan reaches " + formatMoney(baseline.lowest.balanceCents) + " and this scenario reaches " + formatMoney(scenario.lowest.balanceCents) + ".");
        else statements.push("Neither version falls below zero within this forecast.");
        const contributionChanges = state.scenarioDraft.changes.filter(change => change.type === "contribution-change");
        contributionChanges.forEach(change => {
          const goal = state.plan.goals.find(item => item.id === change.goalId);
          if (!goal) return;
          const baselineProjection = calculateGoalProjection(state.plan, goal, baseline);
          const scenarioProjection = calculateGoalProjection(state.plan, goal, scenario);
          statements.push(goal.name + " is projected at " + formatMoney(baselineProjection.projectedCents) + " in the current plan and " + formatMoney(scenarioProjection.projectedCents) + " with this decision.");
        });
        return '<div class="result-copy"><h3>What the numbers say</h3><ul>' + statements.map(statement => '<li>' + escapeText(statement) + '</li>').join("") + '</ul><p class="field-hint">This comparison is an estimate from your entries, not a guarantee that a choice is safe or affordable.</p></div>';
      }

      function comparisonChartMarkup(comparison) {
        const current = comparison.baseline;
        const scenario = comparison.scenario;
        const g = chartGeometry(current, scenario.days.map(day => day.closingBalanceCents));
        const currentPath = current.days.map((day, index) => (index ? "L" : "M") + g.x(index).toFixed(2) + " " + g.y(day.closingBalanceCents).toFixed(2)).join(" ");
        const scenarioPath = scenario.days.map((day, index) => (index ? "L" : "M") + g.x(index).toFixed(2) + " " + g.y(day.closingBalanceCents).toFixed(2)).join(" ");
        const yGrid = g.ticks.map(value => '<g><line x1="' + g.left + '" x2="' + (g.width - g.right) + '" y1="' + g.y(value).toFixed(2) + '" y2="' + g.y(value).toFixed(2) + '" stroke="#D7DFD3"/><text x="' + (g.left - 11) + '" y="' + (g.y(value) + 4).toFixed(2) + '" text-anchor="end" fill="#587067" font-size="12">' + formatChartMoney(value) + '</text></g>').join("");
        const xIndexes = [...new Set([0, Math.floor((current.days.length - 1) / 2), current.days.length - 1])];
        const xLabels = xIndexes.map(index => '<text x="' + g.x(index).toFixed(2) + '" y="' + (g.height - 18) + '" text-anchor="' + (index === 0 ? "start" : index === current.days.length - 1 ? "end" : "middle") + '" fill="#587067" font-size="12">' + formatShortDate(current.days[index].date) + '</text>').join("");
        const cushionY = g.y(current.cushionCents);
        const zeroY = g.y(0);
        const initialIndex = Math.min(current.days.length - 1, Math.max(0, state.labInspectIndex));
        const inspectX = g.x(initialIndex);
        return '<svg id="lab-chart" class="balance-chart" viewBox="0 0 ' + g.width + ' ' + g.height + '" role="img" tabindex="0" aria-labelledby="lab-chart-title lab-chart-description" data-left="' + g.left + '" data-right="' + g.right + '" data-width="' + g.width + '"><title id="lab-chart-title">Current plan and scenario daily closing balances</title><desc id="lab-chart-description">The current plan is a muted dashed line. The scenario is a solid green line. Use the pointer or arrow keys to inspect matching dates.</desc><rect width="' + g.width + '" height="' + g.height + '" rx="12" fill="#FFFDF7"/>' + yGrid + '<line x1="' + g.left + '" x2="' + (g.width - g.right) + '" y1="' + cushionY + '" y2="' + cushionY + '" stroke="#EDAA87" stroke-width="2" stroke-dasharray="7 6"/><text x="' + (g.width - g.right - 4) + '" y="' + (cushionY - 7) + '" text-anchor="end" fill="#7B422D" font-size="12" font-weight="700">Cushion ' + formatMoney(current.cushionCents) + '</text><line x1="' + g.left + '" x2="' + (g.width - g.right) + '" y1="' + zeroY + '" y2="' + zeroY + '" stroke="#9A3E35" stroke-width="2" stroke-dasharray="3 6"/><text x="' + (g.left + 5) + '" y="' + (zeroY - 7) + '" fill="#9A3E35" font-size="12" font-weight="700">Zero</text><path d="' + currentPath + '" fill="none" stroke="#9EB39A" stroke-width="4" stroke-dasharray="9 7"/><path d="' + scenarioPath + '" fill="none" stroke="#173F35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line id="lab-inspect-line" x1="' + inspectX + '" x2="' + inspectX + '" y1="' + g.top + '" y2="' + (g.height - g.bottom) + '" stroke="#24584A" opacity=".42"/><circle id="lab-current-point" cx="' + inspectX + '" cy="' + g.y(current.days[initialIndex].closingBalanceCents) + '" r="5" fill="#FFFDF7" stroke="#7E9B82" stroke-width="3"/><circle id="lab-scenario-point" cx="' + inspectX + '" cy="' + g.y(scenario.days[initialIndex].closingBalanceCents) + '" r="6" fill="#FFFDF7" stroke="#173F35" stroke-width="3"/>' + xLabels + '</svg>';
      }

      function comparisonTableMarkup(comparison) {
        const rows = comparison.baseline.days.map((day, index) => {
          const scenarioDay = comparison.scenario.days[index];
          const difference = scenarioDay.closingBalanceCents - day.closingBalanceCents;
          return '<tr><td>' + formatDate(day.date) + '</td><td>' + formatMoney(day.closingBalanceCents) + '</td><td>' + formatMoney(scenarioDay.closingBalanceCents) + '</td><td class="' + (difference < 0 ? "negative" : "") + '">' + (difference > 0 ? "+" : "") + formatMoney(difference) + '</td></tr>';
        }).join("");
        return '<details class="daily-details"><summary>View accessible comparison table</summary><div class="table-wrap"><table class="balance-table"><caption class="sr-only">Daily current-plan and scenario closing balances</caption><thead><tr><th scope="col">Date</th><th scope="col">Current plan</th><th scope="col">With decision</th><th scope="col">Difference</th></tr></thead><tbody>' + rows + '</tbody></table></div></details>';
      }

      function shortfallAlertMarkup(comparison) {
        const goesBelowZero = comparison.scenario.lowest.balanceCents < 0;
        if (!goesBelowZero) return '<div class="shortfall-banner clear" role="status"><span class="shortfall-mark" aria-hidden="true">✓</span><div><strong>No projected shortfall</strong><span>The lowest scenario balance is ' + formatMoney(comparison.scenario.lowest.balanceCents) + ' on ' + formatDate(comparison.scenario.lowest.date) + '.</span></div></div>';
        const shortfall = comparison.scenario.firstBelowZero || comparison.scenario.lowest;
        return '<div class="shortfall-banner" role="alert"><span class="shortfall-mark" aria-hidden="true">!</span><div><strong>First shortfall: ' + formatMoney(Math.abs(shortfall.balanceCents)) + ' below zero</strong><span>' + formatDate(shortfall.date) + ' · projected closing balance ' + formatMoney(shortfall.balanceCents) + '</span></div></div>';
      }

      function demoStoryMarkup() {
        const startDate = state.plan.planningStartDate;
        const rentEntry = state.plan.expenses.find(entry => entry.category === "Housing");
        const paycheckEntry = state.plan.incomes.find(entry => entry.status === "confirmed");
        if (!rentEntry || !paycheckEntry) return "";
        const rentDate = rentEntry.nextDate;
        const paydayDate = paycheckEntry.nextDate;
        const earlyScenario = clonePlan(state.scenarioDraft);
        const paydayScenario = clonePlan(state.scenarioDraft);
        const earlyPurchase = earlyScenario.changes.find(change => change.type === "purchase");
        const paydayPurchase = paydayScenario.changes.find(change => change.type === "purchase");
        if (!earlyPurchase || !paydayPurchase) return "";
        earlyPurchase.date = startDate;
        paydayPurchase.date = paydayDate;
        const early = calculateScenarioComparison(state.plan, state.forecastHorizon, state.forecastIncomeMode, earlyScenario).scenario;
        const payday = calculateScenarioComparison(state.plan, state.forecastHorizon, state.forecastIncomeMode, paydayScenario).scenario;
        const isPayday = state.scenarioDraft.changes.find(change => change.type === "purchase").date === paydayDate;
        const earlyBelowZero = early.lowest.balanceCents < 0;
        const paydayBelowZero = payday.lowest.balanceCents < 0;
        const endingCopy = early.endingBalanceCents === payday.endingBalanceCents ? 'Both purchase dates lead to the same ' + formatMoney(payday.endingBalanceCents) + ' ending balance. ' : 'The earlier purchase ends at ' + formatMoney(early.endingBalanceCents) + ', while the payday purchase ends at ' + formatMoney(payday.endingBalanceCents) + '. ';
        let timingCopy = "Neither purchase date creates a shortfall.";
        if (earlyBelowZero && !paydayBelowZero) timingCopy = 'Only the earlier purchase creates a ' + formatMoney(Math.abs(early.lowest.balanceCents)) + ' shortfall.';
        else if (earlyBelowZero && paydayBelowZero) timingCopy = 'Both dates create shortfalls: ' + formatMoney(Math.abs(early.lowest.balanceCents)) + ' when bought earlier and ' + formatMoney(Math.abs(payday.lowest.balanceCents)) + ' on payday.';
        else if (!earlyBelowZero && paydayBelowZero) timingCopy = 'Only the payday purchase creates a ' + formatMoney(Math.abs(payday.lowest.balanceCents)) + ' shortfall.';

        return '<section class="card demo-story" aria-labelledby="demo-story-title"><div class="demo-story-head"><div><p class="eyebrow">Fictional University of Kentucky student</p><h2 id="demo-story-title">Can Maya buy this before rent?</h2><p>Compare the same ' + formatMoney(earlyPurchase.amountCents) + ' purchase before rent and after the campus paycheck arrives.</p></div><button class="button primary" type="button" data-demo-payday' + (isPayday ? ' disabled' : '') + '>' + (isPayday ? 'Purchase moved to payday' : 'Try buying on payday') + '</button></div><div class="demo-timeline" aria-label="Demo timeline"><div class="demo-event"><span>Starting cash</span><strong>' + formatMoney(state.plan.availableBalanceCents) + '</strong></div><div class="demo-event"><span>Day 1 · purchase</span><strong>−' + formatMoney(earlyPurchase.amountCents) + '</strong></div><div class="demo-event"><span>' + formatDate(rentDate) + ' · rent share</span><strong>−' + formatMoney(rentEntry.amountCents) + '</strong></div><div class="demo-event"><span>' + formatDate(paydayDate) + ' · confirmed pay</span><strong>+' + formatMoney(paycheckEntry.amountCents) + '</strong></div></div><p class="demo-story-sentence">' + resultSentence + '</p></section>';
      }

      function moveDemoPurchaseToPayday() {
        if (!state.plan || state.plan.demoStory !== "fictional-uk-student-purchase" || !state.scenarioDraft) return;
        const purchase = state.scenarioDraft.changes.find(change => change.type === "purchase");
        if (!purchase) return;
        const paycheck = state.plan.incomes.find(entry => entry.status === "confirmed");
        if (!paycheck) return;
        purchase.date = paycheck.nextDate;
        state.scenarioDraft.updatedAt = new Date().toISOString();
        const savedIndex = state.plan.scenarios.findIndex(scenario => scenario.id === state.scenarioDraft.id);
        if (savedIndex >= 0) state.plan.scenarios[savedIndex] = clonePlan(state.scenarioDraft);
        state.scenarioDraftBaseline = clonePlan(state.scenarioDraft);
        state.scenarioDraftDirty = false;
        markDirty(true);
        render();
        showToast("Purchase moved to payday. The baseline money plan is unchanged.");
      }

      function labMarkup() {
        ensureScenarioDraft();
        const comparison = calculateScenarioComparison(state.plan, state.forecastHorizon, state.forecastIncomeMode, state.scenarioDraft);
        const incomeForecast = calculateForecast(state.plan, state.forecastHorizon, state.forecastIncomeMode);
        const incomeOccurrences = incomeForecast.transactions.filter(transaction => transaction.type === "income");
        const occurrenceChoices = incomeOccurrences.map(transaction => transaction.occurrenceId);
        const occurrenceLabels = Object.fromEntries(incomeOccurrences.map(transaction => [transaction.occurrenceId, formatDate(transaction.date) + " · " + transaction.label + " · " + formatMoney(transaction.amountCents) + " · " + titleCase(transaction.status)]));
        const housingEntries = state.plan.expenses.filter(entry => entry.category === "Housing" && entry.frequency !== "one-time");
        const housingChoices = housingEntries.map(entry => entry.id);
        const housingLabels = Object.fromEntries(housingEntries.map(entry => [entry.id, entry.label + " · " + formatMoney(entry.amountCents) + " · " + titleCase(entry.frequency)]));
        const purchase = scenarioEditingChange("purchase");
        const payChange = scenarioEditingChange("paycheck-change");
        const delay = scenarioEditingChange("paycheck-delay");
        const housing = scenarioEditingChange("housing-change");
        const contribution = scenarioEditingChange("contribution-change");
        const contributionOccurrences = incomeForecast.transactions.filter(transaction => transaction.transferToSavings);
        const contributionChoices = contributionOccurrences.map(transaction => transaction.occurrenceId);
        const contributionLabels = Object.fromEntries(contributionOccurrences.map(transaction => [transaction.occurrenceId, formatDate(transaction.date) + " · " + transaction.label + " · " + formatMoney(transaction.amountCents)]));
        [payChange, delay].filter(Boolean).forEach(change => {

          if (!occurrenceChoices.includes(key)) {
            occurrenceChoices.push(key);
            occurrenceLabels[key] = formatDate(change.occurrenceDate) + " · Unavailable in this forecast (cannot be retargeted silently)";
          }
        });
        if (housing && !housingChoices.includes(housing.sourceId)) {
          housingChoices.push(housing.sourceId);
          housingLabels[housing.sourceId] = "Unavailable original housing entry (cannot be retargeted silently)";
        }
        const purchaseForm = fieldMarkup("purchaseDescription", "Description", "text", purchase ? purchase.description : "", { maxlength: 100, span: true, placeholder: "For example, used laptop" }) + fieldMarkup("purchaseAmount", "Amount", "text", purchase ? moneyInput(purchase.amountCents) : "", { placeholder: "0.00" }) + fieldMarkup("purchaseDate", "Purchase date", "date", purchase ? purchase.date : state.plan.planningStartDate) + scenarioFormActions("purchase", purchase);
        const payChangeSelected = payChange ? occurrenceId("income", payChange.sourceId, payChange.occurrenceDate) : occurrenceChoices[0] || "";
        const payChangeForm = fieldMarkup("payChangeOccurrence", "Upcoming paycheck", "select", payChangeSelected, { choices: occurrenceChoices, labels: occurrenceLabels, span: true, hint: !occurrenceChoices.length ? "No eligible income occurs in this forecast." : state.forecastIncomeMode === "confirmed" ? "Estimated paychecks are excluded from confirmed-only mode and are not offered here." : "Only this dated occurrence will change." }) + fieldMarkup("payChangeAmount", "Replacement take-home amount", "text", payChange ? moneyInput(payChange.amountCents) : "", { placeholder: "0.00", span: true }) + scenarioFormActions("paycheck-change", payChange);
        const delaySelected = delay ? occurrenceId("income", delay.sourceId, delay.occurrenceDate) : occurrenceChoices[0] || "";
        const delayForm = fieldMarkup("delayOccurrence", "Upcoming paycheck", "select", delaySelected, { choices: occurrenceChoices, labels: occurrenceLabels, span: true, hint: !occurrenceChoices.length ? "No eligible income occurs in this forecast." : state.forecastIncomeMode === "confirmed" ? "Estimated paychecks are excluded from confirmed-only mode and are not offered here." : "The paycheck keeps its confirmed or estimated status." }) + fieldMarkup("delayDate", "New arrival date", "date", delay ? delay.newDate : addCalendarDays(state.plan.planningStartDate, 1), { span: true }) + scenarioFormActions("paycheck-delay", delay);
        const housingForm = fieldMarkup("housingSource", "Recurring housing expense", "select", housing ? housing.sourceId : housingChoices[0] || "", { choices: housingChoices, labels: housingLabels, span: true, hint: !housingChoices.length ? "Add a recurring Housing expense to your money plan first." : "Use only your personal share, not the whole household cost." }) + fieldMarkup("housingAmount", "New personal-share amount", "text", housing ? moneyInput(housing.amountCents) : "", { placeholder: "0.00" }) + fieldMarkup("housingEffectiveDate", "Effective date", "date", housing ? housing.effectiveDate : state.plan.planningStartDate) + fieldMarkup("movingCost", "One-time moving cost", "text", housing && housing.movingCostCents ? moneyInput(housing.movingCostCents) : "", { optional: true, placeholder: "0.00", span: true, hint: "Applied on the effective date." }) + scenarioFormActions("housing-change", housing);
        const contributionSelected = contribution ? occurrenceId("contribution", contribution.sourceId, contribution.occurrenceDate) : contributionChoices[0] || "";
        if (contribution && !contributionChoices.includes(contributionSelected)) { contributionChoices.push(contributionSelected); contributionLabels[contributionSelected] = formatDate(contribution.occurrenceDate) + " · Unavailable contribution occurrence"; }
        const contributionForm = fieldMarkup("contributionOccurrence", "Upcoming contribution", "select", contributionSelected, { choices: contributionChoices, labels: contributionLabels, span: true, hint: !contributionChoices.length ? "Add a goal contribution schedule first." : "Only this dated occurrence changes; your saved plan stays untouched." }) + fieldMarkup("scenarioContributionAmount", "Replacement contribution", "text", contribution ? moneyInput(contribution.amountCents) : "", { placeholder: "0.00", span: true }) + scenarioFormActions("contribution-change", contribution);
        const tabs = state.plan.scenarios.map(scenario => '<button class="scenario-tab' + (state.activeScenarioId === scenario.id ? " active" : "") + '" type="button" data-scenario-switch="' + escapeText(scenario.id) + '">' + escapeText(scenario.name) + '</button>').join("");
        const initialIndex = Math.min(comparison.baseline.days.length - 1, Math.max(0, state.labInspectIndex));
        const initialCurrent = comparison.baseline.days[initialIndex];
        const initialScenario = comparison.scenario.days[initialIndex];
        return '<div class="page lab-page"><header class="page-header"><div><p class="eyebrow">Decision lab · ' + state.forecastHorizon + '-day ' + (state.forecastIncomeMode === "expected" ? "expected" : "confirmed-only") + ' view</p><h1>Try the decision before you make it.</h1><p class="lede">See how a change could affect your balance and breathing room.</p></div><div class="forecast-controls"><div class="control-group" aria-label="Decision horizon">' + [30,60,90].map(days => '<button class="control-button' + (state.forecastHorizon === days ? " active" : "") + '" type="button" data-horizon="' + days + '">' + days + ' days</button>').join("") + '</div></div></header><div class="lab-toolbar"><div class="scenario-tabs" aria-label="Saved scenarios">' + tabs + '</div><button class="button secondary" type="button" data-scenario-action="new">New scenario</button></div><div class="lab-layout"><section class="lab-editor" aria-label="Scenario editor"><div class="card card-pad scenario-meta"><form id="scenario-meta-form" class="form-grid" novalidate>' + fieldMarkup("scenarioName", "Scenario name", "text", state.scenarioDraft.name, { maxlength: 60, span: true }) + '<div class="field span-2"><label for="scenarioReflection">Optional reflection</label><select id="scenarioReflection" name="scenarioReflection"><option value=""' + (!state.scenarioDraft.reflection ? " selected" : "") + '>Prefer not to answer</option><option value="essential"' + (state.scenarioDraft.reflection === "essential" ? " selected" : "") + '>Essential</option><option value="flexible"' + (state.scenarioDraft.reflection === "flexible" ? " selected" : "") + '>Flexible</option><option value="wait"' + (state.scenarioDraft.reflection === "wait" ? " selected" : "") + '>Something that can wait</option></select><p class="field-error" id="scenarioReflection-error"></p></div><div class="field span-2"><div class="button-row"><button class="button primary" type="submit">Save scenario</button><button class="button secondary" type="button" data-scenario-action="discard">Discard changes</button>' + (state.activeScenarioId ? '<button class="button danger" type="button" data-scenario-action="delete">Delete scenario</button>' : "") + '</div></div></form></div><section class="card card-pad"><h2>Changes in this scenario</h2><div id="scenario-change-list"></div></section><details class="scenario-card" open><summary><span class="scenario-number">1</span><span><span class="scenario-card-title">Make a purchase</span><span class="scenario-card-copy">Add one hypothetical expense.</span></span></summary><form id="purchase-form" class="scenario-form"><div class="form-grid">' + purchaseForm + '</div></form></details><details class="scenario-card"><summary><span class="scenario-number">2</span><span><span class="scenario-card-title">Change a paycheck</span></span></summary><form id="paycheck-change-form" class="scenario-form"><div class="form-grid">' + payChangeForm + '</div></form></details><details class="scenario-card"><summary><span class="scenario-number">3</span><span><span class="scenario-card-title">Delay a paycheck</span></span></summary><form id="paycheck-delay-form" class="scenario-form"><div class="form-grid">' + delayForm + '</div></form></details><details class="scenario-card"><summary><span class="scenario-number">4</span><span><span class="scenario-card-title">Change my housing cost</span></span></summary><form id="housing-change-form" class="scenario-form"><div class="form-grid">' + housingForm + '</div></form></details><details class="scenario-card"><summary><span class="scenario-number">5</span><span><span class="scenario-card-title">Change a savings contribution</span><span class="scenario-card-copy">Change one transfer occurrence and compare both cash and goal progress.</span></span></summary><form id="contribution-change-form" class="scenario-form"><div class="form-grid">' + contributionForm + '</div></form></details></section><aside class="lab-results"><section class="card comparison-card"><div class="comparison-head"><div><p class="eyebrow">Side-by-side results</p><h2>Current plan vs. this decision</h2></div></div><div class="comparison-grid"><div class="comparison-column"><h3>Current plan</h3>' + comparisonMetricRows(comparison.baseline) + '</div><div class="comparison-column scenario"><h3>With this decision</h3>' + comparisonMetricRows(comparison.scenario, comparison.baseline) + '</div></div>' + deterministicResultMarkup(comparison) + '<div class="chart-wrap">' + comparisonChartMarkup(comparison) + '</div><div id="lab-inspection" class="chart-inspection lab-inspection" aria-live="polite"><strong>' + formatDate(initialCurrent.date) + '</strong> · Current <span>' + formatMoney(initialCurrent.closingBalanceCents) + '</span> · With decision <span>' + formatMoney(initialScenario.closingBalanceCents) + '</span></div>' + comparisonTableMarkup(comparison) + '</section><div id="scenario-issues"></div></aside></div>' + footerMarkup() + '</div>';
      }

      function renderScenarioChanges() {
        const container = document.getElementById("scenario-change-list");
        const issueContainer = document.getElementById("scenario-issues");
        if (!container || !issueContainer) return;
        const comparison = calculateScenarioComparison(state.plan, state.forecastHorizon, state.forecastIncomeMode, state.scenarioDraft);
        const issueByChange = new Map(comparison.issues.map(issue => [issue.changeId, issue]));
        if (!state.scenarioDraft.changes.length) {
          const empty = el("div", "empty-state");
          empty.append(el("strong", "", "No hypothetical changes yet"), el("span", "", "Use one of the five cards below to build a decision."));
          container.replaceChildren(empty);
        } else {
          const list = el("ul", "scenario-change-list");
          state.scenarioDraft.changes.forEach(change => {
            const issue = issueByChange.get(change.id);
            const item = el("li", "scenario-change" + (issue && issue.level === "error" ? " unresolved" : ""));
            const top = el("div", "scenario-change-top");
            const copy = el("div");
            copy.append(el("div", "scenario-change-title", scenarioChangeTitle(change)), el("p", "scenario-change-detail", scenarioChangeDetail(change)));
            if (issue) copy.append(el("p", "scenario-change-detail negative", "⚠ " + issue.message));
            top.append(copy, el("span", "tag", titleCase(change.type)));
            const actions = el("div", "scenario-change-actions");
            const edit = el("button", "button secondary", "Edit");
            edit.type = "button";
            edit.dataset.scenarioEditChange = change.id;
            actions.append(edit);
            const baselineChange = state.scenarioDraftBaseline && state.scenarioDraftBaseline.changes.find(item => item.id === change.id);
            if (!baselineChange || JSON.stringify(baselineChange) !== JSON.stringify(change)) {
              const reset = el("button", "button secondary", "Reset");
              reset.type = "button";
              reset.dataset.scenarioResetChange = change.id;
              actions.append(reset);
            }
            const remove = el("button", "button danger", "Remove");
            remove.type = "button";
            remove.dataset.scenarioRemoveChange = change.id;
            actions.append(remove);
            item.append(top, actions);
            list.append(item);
          });
          container.replaceChildren(list);
        }
        if (comparison.issues.length) {
          const wrap = el("div", "issue-list");
          comparison.issues.forEach(issue => wrap.append(el("div", "issue " + (issue.level === "error" ? "error" : ""), (issue.level === "error" ? "⚠ " : "ℹ ") + issue.message)));
          issueContainer.replaceChildren(wrap);
        } else issueContainer.replaceChildren();
      }

      function decorateLabResults() {
        const page = document.querySelector(".lab-page");
        const comparisonHead = document.querySelector(".comparison-head");
        if (!page || !comparisonHead || !state.scenarioDraft) return;
        const comparison = calculateScenarioComparison(state.plan, state.forecastHorizon, state.forecastIncomeMode, state.scenarioDraft);
        const heading = page.querySelector("h1");
        if (heading) heading.textContent = "Compare your options.";
        comparisonHead.insertAdjacentHTML("afterend", shortfallAlertMarkup(comparison));
        if (state.plan.demoStory === "fictional-uk-student-purchase") {
          page.classList.add("demo-lab");
          const header = page.querySelector(".page-header");
          if (header) header.insertAdjacentHTML("afterend", demoStoryMarkup());
        }
      }

      function syncScenarioDraftDirty() {
        const comparable = scenario => JSON.stringify({ name: scenario.name, reflection: scenario.reflection, changes: scenario.changes });
        state.scenarioDraftDirty = comparable(state.scenarioDraft) !== comparable(state.scenarioDraftBaseline);
        if (state.scenarioDraftDirty) state.scenarioDraft.updatedAt = new Date().toISOString();
        refreshDirtyState();
      }

      function upsertScenarioChange(change) {
        const editingId = state.scenarioEditingChangeId;
        const others = state.scenarioDraft.changes.filter(item => item.id !== editingId);
        if (!editingId && state.scenarioDraft.changes.length >= 20) { showToast("A scenario can contain up to 20 changes.", true); return; }
        if (change.type === "paycheck-change" || change.type === "paycheck-delay") {
          if (others.some(item => (item.type === "paycheck-change" || item.type === "paycheck-delay") && item.sourceId === change.sourceId && item.occurrenceDate === change.occurrenceDate)) {
            showToast("That paycheck occurrence already has a change. Edit or remove it first.", true);
            return;
          }
        }
        if (change.type === "housing-change" && others.some(item => item.type === "housing-change" && item.sourceId === change.sourceId)) {
          showToast("That housing entry already has a change in this scenario.", true);
          return;
        }
        if (change.type === "contribution-change" && others.some(item => item.type === "contribution-change" && item.sourceId === change.sourceId && item.occurrenceDate === change.occurrenceDate)) {
          showToast("That contribution occurrence already has a change in this scenario.", true);
          return;
        }
        if (editingId) {
          const index = state.scenarioDraft.changes.findIndex(item => item.id === editingId);
          state.scenarioDraft.changes[index] = { ...change, id: editingId };
        } else state.scenarioDraft.changes.push({ ...change, id: createId("change") });
        state.scenarioEditingChangeId = null;
        syncScenarioDraftDirty();
        render();
        showToast(editingId ? "Scenario change updated." : "Scenario change added.");
      }

      function selectedIncomeOccurrence(value) {
        return calculateForecast(state.plan, state.forecastHorizon, state.forecastIncomeMode).transactions.find(transaction => transaction.type === "income" && transaction.occurrenceId === value) || null;
      }

      function selectedContributionOccurrence(value) {
        return calculateForecast(state.plan, state.forecastHorizon, state.forecastIncomeMode).transactions.find(transaction => transaction.transferToSavings && transaction.occurrenceId === value) || null;
      }

      function saveScenarioChangeForm(form) {
        clearFormErrors(form);
        if (form.id === "purchase-form") {
          const description = form.elements.purchaseDescription.value.trim();
          const amountCents = parseMoney(form.elements.purchaseAmount.value);
          const date = form.elements.purchaseDate.value;
          let valid = true;
          if (!description) { showFieldError("purchaseDescription", "Add a short description."); valid = false; }
          if (amountCents === null || amountCents <= 0) { showFieldError("purchaseAmount", "Enter an amount greater than zero."); valid = false; }
          if (!validCalendarDate(date)) { showFieldError("purchaseDate", "Choose a valid date."); valid = false; }
          if (valid) upsertScenarioChange({ type: "purchase", description, amountCents, date });
          return;
        }
        if (form.id === "paycheck-change-form") {
          const occurrence = selectedIncomeOccurrence(form.elements.payChangeOccurrence.value);
          const amountCents = parseMoney(form.elements.payChangeAmount.value);
          if (!occurrence) { showFieldError("payChangeOccurrence", "Choose an eligible paycheck occurrence."); return; }
          if (amountCents === null) { showFieldError("payChangeAmount", "Enter a non-negative replacement amount."); return; }
          upsertScenarioChange({ type: "paycheck-change", sourceId: occurrence.sourceId, occurrenceDate: occurrence.date, amountCents });
          return;
        }
        if (form.id === "paycheck-delay-form") {
          const occurrence = selectedIncomeOccurrence(form.elements.delayOccurrence.value);
          const newDate = form.elements.delayDate.value;
          let valid = true;
          if (!occurrence) { showFieldError("delayOccurrence", "Choose an eligible paycheck occurrence."); valid = false; }
          if (!validCalendarDate(newDate)) { showFieldError("delayDate", "Choose a valid new date."); valid = false; }
          if (valid) upsertScenarioChange({ type: "paycheck-delay", sourceId: occurrence.sourceId, occurrenceDate: occurrence.date, newDate });
          return;
        }
        if (form.id === "housing-change-form") {
          const sourceId = form.elements.housingSource.value;
          const source = state.plan.expenses.find(entry => entry.id === sourceId && entry.category === "Housing" && entry.frequency !== "one-time");
          const amountCents = parseMoney(form.elements.housingAmount.value);
          const effectiveDate = form.elements.housingEffectiveDate.value;
          const movingCostCents = parseMoney(form.elements.movingCost.value.trim() || "0");
          let valid = true;
          if (!source) { showFieldError("housingSource", "Choose an existing recurring housing expense."); valid = false; }
          if (amountCents === null) { showFieldError("housingAmount", "Enter a non-negative personal-share amount."); valid = false; }
          if (!validCalendarDate(effectiveDate)) { showFieldError("housingEffectiveDate", "Choose a valid effective date."); valid = false; }
          if (movingCostCents === null) { showFieldError("movingCost", "Enter a non-negative amount or leave it blank."); valid = false; }
          if (valid) upsertScenarioChange({ type: "housing-change", sourceId, amountCents, effectiveDate, movingCostCents });
          return;
        }
        if (form.id === "contribution-change-form") {
          const occurrence = selectedContributionOccurrence(form.elements.contributionOccurrence.value);
          const amountCents = parseMoney(form.elements.scenarioContributionAmount.value);
          if (!occurrence) { showFieldError("contributionOccurrence", "Choose an upcoming contribution occurrence."); return; }
          if (amountCents === null) { showFieldError("scenarioContributionAmount", "Enter a non-negative replacement amount."); return; }
          upsertScenarioChange({ type: "contribution-change", goalId: occurrence.goalId, sourceId: occurrence.sourceId, occurrenceDate: occurrence.date, amountCents });
        }
      }

      function saveScenarioDraft(form) {
        clearFormErrors(form);
        const name = form.elements.scenarioName.value.trim();
        if (!name || name.length > 60) { showFieldError("scenarioName", "Use a name between 1 and 60 characters."); return; }
        state.scenarioDraft.name = name;
        state.scenarioDraft.reflection = form.elements.scenarioReflection.value;
        const existingIndex = state.plan.scenarios.findIndex(scenario => scenario.id === state.scenarioDraft.id);
        if (existingIndex < 0 && state.plan.scenarios.length >= 3) { showToast("You can save up to three scenarios. Delete one before saving another.", true); return; }
        if (existingIndex >= 0) state.plan.scenarios[existingIndex] = clonePlan(state.scenarioDraft);
        else state.plan.scenarios.push(clonePlan(state.scenarioDraft));
        state.activeScenarioId = state.scenarioDraft.id;
        state.scenarioDraftBaseline = clonePlan(state.scenarioDraft);
        state.scenarioDraftDirty = false;
        state.scenarioEditingChangeId = null;
        markDirty();
        render();
        showToast("Scenario saved with your plan.");
      }

      function updateLabInspection(index) {
        const comparison = calculateScenarioComparison(state.plan, state.forecastHorizon, state.forecastIncomeMode, state.scenarioDraft);
        const safeIndex = Math.min(comparison.baseline.days.length - 1, Math.max(0, index));
        state.labInspectIndex = safeIndex;
        const current = comparison.baseline.days[safeIndex];
        const scenario = comparison.scenario.days[safeIndex];
        const g = chartGeometry(comparison.baseline, comparison.scenario.days.map(day => day.closingBalanceCents));
        const x = g.x(safeIndex);
        const line = document.getElementById("lab-inspect-line");
        const currentPoint = document.getElementById("lab-current-point");
        const scenarioPoint = document.getElementById("lab-scenario-point");
        const inspection = document.getElementById("lab-inspection");
        if (!line || !currentPoint || !scenarioPoint || !inspection) return;
        line.setAttribute("x1", x); line.setAttribute("x2", x);
        currentPoint.setAttribute("cx", x); currentPoint.setAttribute("cy", g.y(current.closingBalanceCents));
        scenarioPoint.setAttribute("cx", x); scenarioPoint.setAttribute("cy", g.y(scenario.closingBalanceCents));
        inspection.replaceChildren(el("strong", "", formatDate(current.date)), document.createTextNode(" · Current "), el("span", "", formatMoney(current.closingBalanceCents)), document.createTextNode(" · With decision "), el("span", "", formatMoney(scenario.closingBalanceCents)));
      }

      function setupLabChart() {
        const chart = document.getElementById("lab-chart");
        if (!chart) return;
        const inspect = event => {
          const rect = chart.getBoundingClientRect();
          const svgX = (event.clientX - rect.left) / rect.width * Number(chart.dataset.width);
          const plotWidth = Number(chart.dataset.width) - Number(chart.dataset.left) - Number(chart.dataset.right);
          const ratio = Math.min(1, Math.max(0, (svgX - Number(chart.dataset.left)) / plotWidth));
          updateLabInspection(Math.round(ratio * (state.forecastHorizon - 1)));
        };
        chart.addEventListener("pointermove", inspect);
        chart.addEventListener("pointerdown", inspect);
        chart.addEventListener("keydown", event => {
          let next = state.labInspectIndex;
          if (event.key === "ArrowLeft") next -= 1;
          else if (event.key === "ArrowRight") next += 1;
          else if (event.key === "Home") next = 0;
          else if (event.key === "End") next = state.forecastHorizon - 1;
          else return;
          event.preventDefault();
          updateLabInspection(next);
        });
      }

      function sharedCostFormMarkup() {
        const item = state.sharedEditorId && state.sharedEditorId !== "new" ? state.plan.sharedCosts.find(entry => entry.id === state.sharedEditorId) : null;

></section>';

      function planMarkup() {
        const plan = state.plan;
        return '<div class="page"><header class="page-header"><div><p class="eyebrow">Money plan</p><h1>Edit the details</h1><p class="lede">Changes recalculate forecasts immediately. Download a plan file when you want a separate copy.</p></div><div class="button-row"><span class="status-pill ' + (state.dirty ? "dirty" : "") + '">' + (state.dirty ? "Unsaved file changes" : "Plan file up to date") + '</span><button class="button primary" type="button" data-action="save-plan">Save Plan</button></div></header><div class="stack"><div class="grid plan-grid"><section class="card card-pad"><div class="section-head"><div><h2>Basics</h2><p>What is true at the start of your plan.</p></div></div><form id="plan-basics-form" class="form-grid" novalidate>' + fieldMarkup("nickname", "Nickname", "text", plan.nickname, { optional: true, maxlength: 60 }) + fieldMarkup("planningStartDate", "Planning start date", "date", plan.planningStartDate) + fieldMarkup("availableBalance", "Current available balance", "text", moneyInput(plan.availableBalanceCents), { hint: "Available now, before the first day’s transactions. Use a minus sign if overdrawn." }) + fieldMarkup("cushion", "Desired cash cushion", "text", moneyInput(plan.cushionCents)) + '<div class="field span-2"><button class="button secondary" type="submit">Update basics</button></div></form></section><div class="callout"><p><strong>Only your share enters the forecast.</strong></p><p>Shared-cost totals help with the split, but Bluegrass Bloom adds only your linked personal expense. Your cushion remains a comparison threshold.</p></div></div><div class="grid plan-grid"><section class="card card-pad"><div class="section-head"><div><h2>Income</h2><p>Expected take-home amounts; taxes are not estimated.</p></div><button class="button secondary" type="button" data-add="income">Add income</button></div><div id="income-list"></div></section><section class="card card-pad"><div class="section-head"><div><h2>Expenses</h2><p>Personal expenses plus linked shares from shared costs.</p></div><button class="button secondary" type="button" data-add="expense">Add expense</button></div><div id="expense-list"></div></section></div>' + sharedCostFormMarkup() + sharedCostsMarkup() + '<section class="card card-pad"><div class="section-head"><div><h2>Savings goals</h2><p>Manage up to three goals and planned transfers in their own view.</p></div><button class="button primary" type="button" data-view="goals">Open goals</button></div></section></div>' + footerMarkup() + '</div>';
      }

        return '<section class="card card-pad goal-editor"><div class="section-head"><div><h2>' + (goal ? "Edit goal" : "Create a goal") + '</h2><p>Already saved is actual money held outside your available cash.</p></div></div>' + linkedCopy + '<form id="goal-editor-form" class="form-grid" novalidate>' + fieldMarkup("goalEditName", "Goal name", "text", value.name, { maxlength: 80, span: true, placeholder: "For example, emergency buffer" }) + fieldMarkup("goalEditTarget", "Target amount", "text", goal ? moneyInput(value.targetCents) : "", { placeholder: "0.00" }) + fieldMarkup("goalEditSaved", "Already saved outside available balance", "text", goal ? moneyInput(value.savedCents) : "", { placeholder: "0.00" }) + fieldMarkup("goalEditDate", "Target date", "date", value.targetDate || "", { optional: true, span: true }) + '<div class="field span-2"><div class="button-row"><button class="button primary" type="submit">' + (goal ? "Update goal" : "Create goal") + '</button><button class="button secondary" type="button" data-goal-cancel>Cancel</button></div></div></form></section>';

        return '<section class="card card-pad goal-editor"><div class="section-head"><div><h2>' + (entry ? "Edit contribution schedule" : "Plan a contribution") + '</h2><p>Preview the cash and goal effects before adding this schedule to your plan.</p></div></div><form id="contribution-form" class="form-grid" novalidate><input type="hidden" name="contributionGoalId" value="' + escapeText(goal.id) + '">' + fieldMarkup("contributionLabel", "Transfer label", "text", value.label, { maxlength: 80, span: true }) + fieldMarkup("contributionAmount", "Contribution amount", "text", entry ? moneyInput(value.amountCents) : "", { placeholder: "0.00" }) + fieldMarkup("contributionDate", "First date", "date", value.nextDate) + fieldMarkup("contributionFrequency", "Frequency", "select", value.frequency, { choices: frequencies, span: true }) + '<div class="field span-2"><div class="button-row"><button class="button primary" type="submit">Preview forecast effects</button><button class="button secondary" type="button" data-contribution-cancel>Cancel</button></div></div></form></section>';

      function contributionPreviewMarkup() {
        if (!state.contributionPreview) return "";

        const goal = state.plan.goals.find(item => item.id === preview.goalId);
        if (!goal) return "";

        const trialGoal = trial.goals.find(item => item.id === preview.goalId);
        if (preview.editingId) trialGoal.contributions = trialGoal.contributions.filter(item => item.id !== preview.editingId);
        trialGoal.contributions.push(preview.contribution);
        const baseline = calculateForecast(state.plan, state.forecastHorizon, state.forecastIncomeMode);
        const forecast = calculateForecast(trial, state.forecastHorizon, state.forecastIncomeMode);
        const baselineGoal = state.plan.goals.find(item => item.id === preview.goalId);
        const baselineProjection = calculateGoalProjection(state.plan, baselineGoal, baseline);
        const projection = calculateGoalProjection(trial, trialGoal, forecast);
        const savingsChange = projection.projectedCents - baselineProjection.projectedCents;
        const warning = forecast.firstBelowZero ? '<p class="negative"><strong>⚠ Shortfall warning:</strong> this schedule projects cash below zero on ' + formatDate(forecast.firstBelowZero.date) + '. You can still add it after reviewing the result.</p>' : forecast.firstBelowCushion ? '<p><strong>⚠ Cushion warning:</strong> this schedule projects cash below your cushion on ' + formatDate(forecast.firstBelowCushion.date) + '.</p>' : '<p><strong>✓ Cushion check:</strong> projected cash stays at or above your cushion in this horizon.</p>';
        return '<section class="card preview-card"><p class="eyebrow">Review before adding</p><h2>Contribution forecast preview</h2><p>This uses the current ' + state.forecastHorizon + '-day forecast through ' + formatDate(forecast.endDate) + '. It does not extrapolate beyond that date.</p><div class="preview-metrics"><div class="preview-metric"><span>New lowest available balance</span><strong>' + formatMoney(forecast.lowest.balanceCents) + '</strong><span>' + formatDate(forecast.lowest.date) + '</span></div><div class="preview-metric"><span>First below cushion</span><strong>' + (forecast.firstBelowCushion ? formatDate(forecast.firstBelowCushion.date) : 'None') + '</strong></div><div class="preview-metric"><span>First below zero</span><strong class="' + (forecast.firstBelowZero ? 'negative' : '') + '">' + (forecast.firstBelowZero ? '⚠ ' + formatDate(forecast.firstBelowZero.date) : 'None') + '</strong></div><div class="preview-metric"><span>Change in projected goal savings</span><strong>' + (savingsChange >= 0 ? '+' : '−') + formatMoney(Math.abs(savingsChange)) + '</strong><span>New total ' + formatMoney(projection.projectedCents) + '</span></div></div>' + warning + '<div class="button-row"><button class="button primary" type="button" data-contribution-commit>Add contributions to my plan</button><button class="button secondary" type="button" data-contribution-preview-cancel>Keep editing</button></div></section>';

      function goalsMarkup() {
        const forecast = calculateForecast(state.plan, state.forecastHorizon, state.forecastIncomeMode);
        const cards = state.plan.goals.map((goal, index) => {

          const transfers = '<div class="goal-card-transfers"><div><h3>Planned transfers</h3><p class="field-hint">Transfers reduce projected cash and raise only the projected goal total.</p></div>' + (contributions ? '<ul class="contribution-list">' + contributions + '</ul>' : '<div class="empty-state"><strong>No contribution schedule</strong><span>Actual savings is unchanged until you update it yourself.</span></div>') + '<div class="compact-actions"><button class="button primary" type="button" data-contribution-new="' + escapeText(goal.id) + '">Plan contribution</button><button class="button secondary" type="button" data-goal-edit="' + escapeText(goal.id) + '">Edit goal</button><button class="button danger" type="button" data-goal-delete="' + escapeText(goal.id) + '">Delete</button></div></div>';

        return '<div class="page"><header class="page-header"><div><p class="eyebrow">Savings goals · through ' + formatDate(forecast.endDate) + '</p><h1>Grow toward something specific.</h1><p class="lede">Keep money already saved separate from future transfers and available cash.</p></div><div class="button-row"><div class="control-group" aria-label="Goal projection length">' + [30,60,90].map(days => '<button class="control-button' + (state.forecastHorizon === days ? ' active' : '') + '" type="button" data-horizon="' + days + '">' + days + ' days</button>').join('') + '</div>' + (state.plan.goals.length < 3 ? '<button class="button primary" type="button" data-goal-new>Add goal</button>' : '') + '</div></header>' + explanation + goalEditorMarkup() + contributionEditorMarkup() + contributionPreviewMarkup() + (cards ? '<section class="grid goal-grid" data-count="' + state.plan.goals.length + '" aria-label="Savings goals">' + cards + '</section>' : '<div class="goal-grid">' + empty + '</div>') + footerMarkup() + '</div>';
      }

        return '<footer class="footer"><p><strong>Educational use only.</strong> Bluegrass Bloom provides general planning tools, not financial, legal, tax, or investment advice. Verify important decisions with a qualified professional.</p><p>Privacy: your data stays on this device unless you download a plan file. No analytics, accounts, or bank connections.</p><p>Bluegrass Bloom · Copyright © 2026 <strong>bluegrass-bloom</strong> · MIT License</p></footer>';
