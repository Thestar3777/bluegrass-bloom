<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bluegrass Bloom is a private, on-device money planning tool for Kentucky college students.">
  <title>Bluegrass Bloom</title>
  <style>
    :root {
      color-scheme: light;
      --ivory: #fbf7ed;
      --paper: #fffdf7;
      --paper-strong: #ffffff;
      --forest: #173f35;
      --forest-2: #24584a;
      --sage: #9eb39a;
      --sage-light: #e6eee3;
      --sage-pale: #f2f5ee;
      --peach: #edaa87;
      --peach-pale: #fbe9dd;
      --ink-soft: #587067;
      --line: #d7dfd3;
      --danger: #9a3e35;
      --danger-pale: #fae8e4;
      --shadow: 0 18px 46px rgba(23, 63, 53, .09);
      --shadow-soft: 0 8px 24px rgba(23, 63, 53, .06);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --sidebar: 250px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--ivory); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--forest);
      background: var(--ivory);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    a { color: var(--forest-2); }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 3px solid #d77e55; outline-offset: 3px; }

    .skip-link {
      position: fixed;
      left: 16px;
      top: 10px;
      z-index: 100;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--forest);
      color: white;
      transform: translateY(-150%);
    }
    .skip-link:focus { transform: none; }

    .app-shell { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      width: var(--sidebar);
      padding: 28px 22px 24px;
      display: flex;
      flex-direction: column;
      background: var(--forest);
      color: #f8f5e9;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 760; letter-spacing: -.02em; }
    .brand-mark { width: 38px; height: 38px; flex: 0 0 auto; }
    .brand-name { font-size: 1.08rem; }
    .sidebar-note { margin: 34px 4px 10px; color: #bdd0c4; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; }
    .nav-stack { display: grid; gap: 8px; }
    .nav-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #e5ede7;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .nav-button:hover { background: rgba(255,255,255,.08); }
    .nav-button.active { background: #f5f0e3; color: var(--forest); font-weight: 700; }
    .nav-icon { width: 20px; height: 20px; }
    .sidebar-actions { margin-top: auto; display: grid; gap: 9px; }
    .side-action {
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 11px;
      padding: 10px 12px;
      background: transparent;
      color: #f8f5e9;
      cursor: pointer;
      text-align: left;
    }
    .side-action:hover { background: rgba(255,255,255,.08); }
    .privacy-note { margin: 16px 2px 0; color: #a9c0b3; font-size: .78rem; }

    .main-shell { margin-left: var(--sidebar); min-height: 100vh; }
    .mobile-bar { display: none; }
    .page { width: min(1180px, calc(100% - 64px)); margin: 0 auto; padding: 42px 0 76px; }
    .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
    .eyebrow { margin: 0 0 7px; color: var(--forest-2); font-size: .78rem; font-weight: 760; letter-spacing: .11em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 7px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 4vw, 3.35rem); line-height: 1.05; letter-spacing: -.035em; font-weight: 500; }
    h2 { margin-bottom: 8px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.4rem, 2.5vw, 2rem); line-height: 1.2; font-weight: 500; letter-spacing: -.02em; }
    h3 { margin-bottom: 5px; font-size: 1rem; }
    .lede { margin: 0; max-width: 680px; color: var(--ink-soft); font-size: 1.03rem; }

    .button-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .button {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 10px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 720;
      line-height: 1.2;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }
    .button:hover { transform: translateY(-1px); }
    .button.primary { background: var(--forest); color: white; }
    .button.primary:hover { background: #0e3028; }
    .button.secondary { border-color: var(--line); background: var(--paper-strong); color: var(--forest); }
    .button.secondary:hover { border-color: var(--sage); background: var(--sage-pale); }
    .button.peach { background: var(--peach-pale); color: #713925; }
    .button.danger { background: var(--danger-pale); color: var(--danger); }
    .button.ghost { min-height: 38px; padding: 7px 12px; border-color: var(--line); background: transparent; font-size: .9rem; }
    .button.icon-only { width: 42px; padding: 0; }
    .button:disabled { opacity: .48; cursor: not-allowed; transform: none; }

    .card { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--paper); box-shadow: var(--shadow-soft); }
    .card-pad { padding: 26px; }
    .grid { display: grid; gap: 20px; }
    .summary-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 20px; }
    .summary-card { min-height: 165px; padding: 23px; position: relative; overflow: hidden; }
    .summary-label { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: .9rem; font-weight: 680; }
    .summary-value { margin: 18px 0 6px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.85rem, 3vw, 2.55rem); line-height: 1; letter-spacing: -.025em; }
    .summary-help { margin: 0; color: var(--ink-soft); font-size: .84rem; }
    .balance-card { background: var(--forest); color: white; border-color: var(--forest); }
    .balance-card .summary-label, .balance-card .summary-help { color: #c8d8ce; }
    .balance-card::after { content: ""; position: absolute; width: 95px; height: 95px; right: -24px; bottom: -26px; border: 18px solid rgba(237,170,135,.17); border-radius: 50%; }
    .content-grid { grid-template-columns: minmax(0, 1.55fr) minmax(280px, .85fr); align-items: start; }
    .stack { display: grid; gap: 20px; }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
    .section-head p { margin: 2px 0 0; color: var(--ink-soft); font-size: .9rem; }
    .entry-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .entry-row { padding: 15px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper-strong); display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 15px; }
    .entry-title { font-weight: 750; overflow-wrap: anywhere; }
    .entry-meta { margin-top: 2px; color: var(--ink-soft); font-size: .82rem; }
    .entry-amount { font-variant-numeric: tabular-nums; font-weight: 760; white-space: nowrap; }
    .entry-actions { display: flex; gap: 5px; }
    .mini-button { width: 35px; height: 35px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); cursor: pointer; display: grid; place-items: center; }
    .mini-button:hover { background: var(--sage-pale); }
    .mini-button.delete:hover { background: var(--danger-pale); color: var(--danger); border-color: #ebc5be; }
    .empty-state { padding: 24px; border: 1px dashed var(--sage); border-radius: 14px; background: var(--sage-pale); text-align: center; color: var(--ink-soft); }
    .empty-state strong { display: block; margin-bottom: 3px; color: var(--forest); }

    .goal-top { display: flex; justify-content: space-between; gap: 18px; align-items: baseline; }
    .goal-name { font-weight: 760; overflow-wrap: anywhere; }
    .goal-number { color: var(--ink-soft); font-size: .9rem; }
    .progress-track { height: 11px; margin: 14px 0 9px; border-radius: 999px; background: var(--sage-light); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--peach); }
    .progress-copy { color: var(--ink-soft); font-size: .83rem; }

    .garden-card { position: sticky; top: 24px; overflow: hidden; }
    .garden-art { margin: 8px -8px -6px; }
    .garden-art svg { display: block; width: 100%; height: auto; }
    .garden-legend { margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--sage-pale); color: var(--ink-soft); font-size: .84rem; }
    .setup-dots { display: flex; gap: 7px; margin-top: 13px; }
    .setup-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
    .setup-dot.done { background: var(--peach); }

    .plan-grid { grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr); align-items: start; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; }
    .field { display: grid; gap: 7px; align-content: start; }
    .field.span-2 { grid-column: 1 / -1; }
    label, .label { color: var(--forest); font-size: .88rem; font-weight: 720; }
    .optional { color: var(--ink-soft); font-weight: 500; }
    input, select {
      width: 100%;
      min-height: 47px;
      border: 1px solid #bdcabe;
      border-radius: 11px;
      padding: 10px 12px;
      background-color: white;
      color: var(--forest);
    }
    select {
      appearance: none;
      padding-right: 38px;
      background-image: linear-gradient(45deg, transparent 50%, var(--forest) 50%), linear-gradient(135deg, var(--forest) 50%, transparent 50%);
      background-position: calc(100% - 17px) 20px, calc(100% - 12px) 20px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    input:hover, select:hover { border-color: var(--sage); }
    input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); background: #fff9f8; }
    .field-hint { margin: 0; color: var(--ink-soft); font-size: .8rem; }
    .field-error { min-height: 1.2em; margin: 0; color: var(--danger); font-size: .8rem; }
    .callout { padding: 16px 18px; border-left: 4px solid var(--peach); border-radius: 0 12px 12px 0; background: var(--peach-pale); color: #68483b; font-size: .9rem; }
    .callout p:last-child { margin-bottom: 0; }

    .welcome {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(370px, .9fr);
      background: var(--ivory);
    }
    .welcome-copy { padding: clamp(36px, 7vw, 104px); display: flex; flex-direction: column; justify-content: center; }
    .welcome .brand { margin-bottom: clamp(50px, 11vh, 112px); color: var(--forest); }
    .welcome h1 { max-width: 700px; font-size: clamp(3.2rem, 7vw, 6.3rem); }
    .welcome-lede { max-width: 620px; margin: 22px 0 32px; color: var(--ink-soft); font-size: clamp(1.05rem, 1.8vw, 1.35rem); }
    .welcome-fine { max-width: 620px; margin: 24px 0 0; color: var(--ink-soft); font-size: .82rem; }
    .welcome-art { position: relative; overflow: hidden; display: grid; place-items: center; padding: 34px; background: var(--forest); }
    .welcome-art svg { width: min(560px, 100%); height: auto; }
    .art-caption { position: absolute; right: 28px; bottom: 25px; color: #b9ccbf; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }

    .onboarding { min-height: 100vh; padding: 28px; display: grid; place-items: center; background: var(--ivory); }
    .onboard-shell { width: min(950px, 100%); }
    .onboard-top { display: flex; justify-content: space-between; gap: 20px; align-items: center; margin-bottom: 22px; }
    .step-count { color: var(--ink-soft); font-size: .84rem; }
    .step-line { display: flex; gap: 7px; width: min(260px, 40vw); }
    .step-segment { height: 5px; flex: 1; border-radius: 999px; background: var(--line); }
    .step-segment.active { background: var(--forest); }
    .onboard-card { padding: clamp(25px, 5vw, 50px); }
    .onboard-card > .lede { margin-bottom: 28px; }
    .onboard-footer { margin-top: 30px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .onboard-list { margin: 24px 0 0; }
    .add-panel { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); }

    dialog { width: min(610px, calc(100% - 28px)); max-height: calc(100vh - 40px); border: 0; border-radius: 22px; padding: 0; color: var(--forest); background: var(--paper); box-shadow: 0 28px 90px rgba(8, 35, 28, .28); }
    dialog::backdrop { background: rgba(13, 38, 32, .56); backdrop-filter: blur(3px); }
    .dialog-body { padding: 28px; overflow-y: auto; }
    .dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 22px; }
    .dialog-head h2 { margin: 0; }
    .dialog-close { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; background: white; cursor: pointer; font-size: 1.3rem; line-height: 1; }
    .dialog-actions { margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px; }
    .decision-dialog { width: min(470px, calc(100% - 28px)); }
    .decision-copy { margin: 8px 0 0; color: var(--ink-soft); }
    .decision-dialog .dialog-actions { padding-top: 4px; }

    .toast-region { position: fixed; z-index: 80; right: 22px; bottom: 22px; display: grid; gap: 9px; pointer-events: none; }
    .toast { max-width: 390px; padding: 13px 14px 13px 17px; border-radius: 12px; background: var(--forest); color: white; box-shadow: var(--shadow); animation: toast-in .22s ease-out; display: flex; align-items: flex-start; gap: 13px; pointer-events: auto; }
    .toast span { flex: 1; }
    .toast-dismiss { width: 28px; height: 28px; flex: 0 0 auto; border: 1px solid rgba(255,255,255,.35); border-radius: 50%; background: transparent; color: white; cursor: pointer; line-height: 1; }
    .toast.error { background: var(--danger); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

    .footer { margin-top: 38px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: .78rem; }
    .footer p { margin-bottom: 6px; }
    .status-pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 999px; background: var(--sage-light); color: var(--forest-2); font-size: .8rem; font-weight: 720; }
    .status-pill.dirty { background: var(--peach-pale); color: #7b422d; }
    .file-input { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .file-feedback { min-height: 0; margin: 10px 2px 0; color: #ffd7cf; font-size: .78rem; }
    .mobile-file-feedback { display: none; }
    [data-file-feedback]:empty { display: none; }

    .forecast-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: flex-end; }
    .control-group { display: inline-flex; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-strong); }
    .control-button { min-height: 36px; border: 0; border-radius: 999px; padding: 7px 13px; background: transparent; color: var(--ink-soft); font-size: .86rem; font-weight: 720; cursor: pointer; }
    .control-button:hover { background: var(--sage-pale); color: var(--forest); }
    .control-button.active { background: var(--forest); color: white; }
    .forecast-summary { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 20px; }
    .forecast-summary .summary-card { min-height: 185px; }
    .summary-card.warning { border-color: #e5b6a5; background: #fff9f5; }
    .summary-card.danger { border-color: #d9a59e; background: var(--danger-pale); }
    .warning-label { display: inline-flex; align-items: center; gap: 7px; color: #7a402e; font-weight: 760; }
    .warning-icon { width: 19px; height: 19px; display: inline-grid; place-items: center; border: 1px solid currentColor; border-radius: 50%; font-size: .76rem; line-height: 1; }
    .forecast-layout { display: grid; gap: 20px; }
    .forecast-note { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 15px 17px; border: 1px solid var(--line); border-radius: 14px; background: var(--sage-pale); color: var(--ink-soft); font-size: .88rem; }
    .forecast-note strong { color: var(--forest); }
    .forecast-note-icon { width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; background: var(--sage-light); color: var(--forest); font-weight: 800; }
    .chart-card { overflow: hidden; }
    .chart-header { padding: 26px 26px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
    .chart-key { display: flex; flex-wrap: wrap; gap: 12px; color: var(--ink-soft); font-size: .78rem; }
    .key-item { display: inline-flex; align-items: center; gap: 6px; }
    .key-line { width: 22px; border-top: 3px solid var(--forest); }
    .key-line.cushion { border-top: 2px dashed var(--peach); }
    .key-line.zero { border-top: 2px dashed #9a3e35; }
    .chart-wrap { padding: 8px 16px 0; overflow-x: auto; }
    .balance-chart { display: block; width: 100%; min-width: 620px; height: auto; border-radius: 12px; touch-action: none; }
    .balance-chart:focus { outline: 3px solid #d77e55; outline-offset: -3px; }
    .chart-summary { margin: 0; padding: 0 26px 23px; color: var(--ink-soft); font-size: .9rem; }
    .chart-summary strong { color: var(--forest); }
    .chart-inspection { margin: 0 26px 22px; min-height: 48px; padding: 11px 14px; border-radius: 11px; background: var(--forest); color: white; font-variant-numeric: tabular-nums; }
    .chart-inspection span { color: #c8d8ce; }
    .daily-details { border-top: 1px solid var(--line); }
    .daily-details summary { padding: 16px 26px; cursor: pointer; font-weight: 730; }
    .table-wrap { overflow-x: auto; padding: 0 26px 24px; }
    .balance-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    .balance-table th { padding: 10px 12px; border-bottom: 2px solid var(--line); color: var(--ink-soft); text-align: left; white-space: nowrap; }
    .balance-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .balance-table th:not(:first-child), .balance-table td:not(:first-child) { text-align: right; }
    .negative { color: var(--danger); font-weight: 760; }
    .upcoming-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .money-row { display: grid; grid-template-columns: 125px minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper-strong); }
    .money-date { color: var(--ink-soft); font-size: .86rem; font-weight: 680; }
    .money-description { font-weight: 750; overflow-wrap: anywhere; }
    .money-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tag { display: inline-flex; padding: 3px 8px; border-radius: 999px; background: var(--sage-light); color: var(--forest-2); font-size: .72rem; font-weight: 720; }
    .tag.estimated { background: var(--peach-pale); color: #7b422d; }
    .money-values { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .signed-amount { display: block; font-weight: 800; }
    .signed-amount.income { color: var(--forest-2); }
    .signed-amount.expense { color: var(--danger); }
    .closing-label { display: block; margin-top: 3px; color: var(--ink-soft); font-size: .74rem; }
    .closing-value { color: var(--forest); font-weight: 720; }
    .forecast-empty { padding: 34px; border: 1px dashed var(--sage); border-radius: 16px; background: var(--sage-pale); text-align: center; }
    .forecast-empty h3 { margin-bottom: 6px; }
    .forecast-empty p { max-width: 650px; margin: 0 auto 18px; color: var(--ink-soft); }
    .forecast-assumptions { border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
    .forecast-assumptions summary { padding: 13px 16px; cursor: pointer; font-weight: 730; }
    .forecast-assumptions div { padding: 0 16px 15px; color: var(--ink-soft); font-size: .88rem; }

    .lab-page { max-width: 1420px; }
    .lab-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .scenario-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .scenario-tab { min-height: 38px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; background: var(--paper-strong); color: var(--ink-soft); font-size: .84rem; font-weight: 720; cursor: pointer; }
    .scenario-tab.active { border-color: var(--forest); background: var(--forest); color: white; }
    .lab-layout { display: grid; grid-template-columns: minmax(350px, .85fr) minmax(560px, 1.45fr); gap: 22px; align-items: start; }
    .lab-editor { display: grid; gap: 16px; }
    .lab-results { position: sticky; top: 20px; display: grid; gap: 16px; }
    .scenario-meta { display: grid; gap: 14px; }
    .scenario-card { border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow-soft); overflow: hidden; }
    .scenario-card[open] { border-color: var(--sage); }
    .scenario-card summary { padding: 17px 19px; display: flex; gap: 12px; align-items: center; cursor: pointer; list-style: none; }
    .scenario-card summary::-webkit-details-marker { display: none; }

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="app"></div>
  <input id="file-input" class="file-input" type="file" accept="application/json,.json">
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <dialog id="entry-dialog" aria-labelledby="entry-dialog-title">
    <form id="entry-form" class="dialog-body" novalidate>
      <div class="dialog-head">
        <div>
          <p class="eyebrow" id="entry-dialog-kicker">Money plan</p>
          <h2 id="entry-dialog-title">Add entry</h2>
        </div>
        <button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
      </div>
      <div id="entry-form-fields" class="form-grid"></div>
      <div class="dialog-actions">
        <button class="button secondary" type="button" data-close-dialog>Cancel</button>
        <button class="button primary" type="submit">Save entry</button>
      </div>
    </form>
  </dialog>

  <dialog id="decision-dialog" class="decision-dialog" aria-labelledby="decision-title" aria-describedby="decision-message">
    <div class="dialog-body">
      <p class="eyebrow">Please confirm</p>
      <h2 id="decision-title">Confirm decision</h2>
      <p id="decision-message" class="decision-copy"></p>
      <div class="dialog-actions">
        <button id="decision-cancel" class="button secondary" type="button">Cancel</button>
        <button id="decision-confirm" class="button danger" type="button">Continue</button>
      </div>
    </div>
  </dialog>

  <script>
    (() => {
      "use strict";

      const SCHEMA_VERSION = 1;
      const STORAGE_KEY = "bluegrass-bloom-v1";
      const frequencies = ["one-time", "weekly", "biweekly", "monthly"];
      const incomeStatuses = ["confirmed", "estimated"];
      const expenseCategories = ["Housing", "Groceries", "Transportation", "Utilities", "School", "Health", "Personal", "Other"];
      const state = {
        screen: "welcome",
        view: "overview",
        onboardingStep: 1,
        plan: null,
        dirty: false,
        planDirty: false,
        entryEditor: null,
        forecastHorizon: 30,
        forecastIncomeMode: "expected",
        forecastInspectIndex: 0,
        scenarioDraft: null,
        scenarioDraftBaseline: null,
        scenarioDraftDirty: false,
        activeScenarioId: null,
        scenarioEditingChangeId: null,
        labInspectIndex: 0,
        goalEditorId: null,
        contributionEditor: null,
        contributionPreview: null,
        sharedEditorId: null
      };
      let storageAvailable = true;
      let pendingDecision = null;
      let lastOpenTrigger = null;

      const app = document.getElementById("app");
      const dialog = document.getElementById("entry-dialog");
      const entryForm = document.getElementById("entry-form");
      const fileInput = document.getElementById("file-input");
      const toastRegion = document.getElementById("toast-region");
      const decisionDialog = document.getElementById("decision-dialog");
      const decisionTitle = document.getElementById("decision-title");
      const decisionMessage = document.getElementById("decision-message");
      const decisionCancel = document.getElementById("decision-cancel");
      const decisionConfirm = document.getElementById("decision-confirm");

      function createId(prefix) {
        return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function emptyScenario(name = "My decision") {
        return { id: createId("scenario"), name, reflection: "", changes: [], updatedAt: new Date().toISOString() };
      }

      function todayISO() {
        const d = new Date();
        return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
      }

      function addCalendarDays(iso, days) {
        const parts = iso.split("-").map(Number);
        const d = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2] + days));
        return [d.getUTCFullYear(), String(d.getUTCMonth() + 1).padStart(2, "0"), String(d.getUTCDate()).padStart(2, "0")].join("-");
      }

      function emptyPlan() {
        return {
          schemaVersion: SCHEMA_VERSION,
          nickname: "",
          availableBalanceCents: 0,
          planningStartDate: todayISO(),
          cushionCents: 0,
          incomes: [],
          expenses: [],
          savingsGoal: null,
          goals: [],
          sharedCosts: [],
          scenarios: [],
          updatedAt: new Date().toISOString()
        };
      }

      function demoPlan(startDate = todayISO()) {
        const rentExpenseId = createId("exp");
        const rentSharedId = createId("shared");
        const scenarioId = createId("scenario");
        const purchaseChangeId = createId("change");
        return {
          schemaVersion: SCHEMA_VERSION,
          nickname: "Maya",
          availableBalanceCents: 50000,
          planningStartDate: startDate,
          cushionCents: 5000,
          incomes: [
            { id: createId("inc"), label: "UK campus paycheck", amountCents: 30000, nextDate: addCalendarDays(startDate, 4), frequency: "one-time", status: "confirmed" }
          ],
          expenses: [
            { id: rentExpenseId, label: "My share of rent", amountCents: 45000, nextDate: addCalendarDays(startDate, 1), frequency: "one-time", category: "Housing", sharedCostId: rentSharedId }
          ],
          savingsGoal: null,
          goals: [],
          sharedCosts: [{ id: rentSharedId, label: "Apartment rent", totalCents: 90000, nextDate: addCalendarDays(startDate, 1), frequency: "one-time", category: "Housing", splitMode: "equal", people: 2, shareCents: 45000, linkedExpenseId: rentExpenseId }],
          scenarios: [{ id: scenarioId, name: "$75 purchase before rent", reflection: "flexible", changes: [{ id: purchaseChangeId, type: "purchase", description: "Proposed purchase", amountCents: 7500, date: startDate }], updatedAt: new Date().toISOString() }],
          updatedAt: new Date().toISOString(),
          demo: true,
          demoStory: "fictional-uk-student-purchase"
        };
      }

      function parseMoney(value) {
        const clean = String(value).trim().replace(/[$,\s]/g, "");
        if (!/^(?:0|[1-9]\d*)(?:\.\d{1,2})?$/.test(clean)) return null;
        const [whole, decimals = ""] = clean.split(".");
        const cents = Number(whole) * 100 + Number((decimals + "00").slice(0, 2));
        return Number.isSafeInteger(cents) && cents >= 0 ? cents : null;
      }

      function parseBalanceMoney(value) {
        const clean = String(value).trim().replace(/[$,\s]/g, "");
        if (!/^-?(?:0|[1-9]\d*)(?:\.\d{1,2})?$/.test(clean)) return null;
        const negative = clean.startsWith("-");
        const unsigned = negative ? clean.slice(1) : clean;
        const [whole, decimals = ""] = unsigned.split(".");
        const cents = Number(whole) * 100 + Number((decimals + "00").slice(0, 2));
        const signed = negative ? -cents : cents;
        return Number.isSafeInteger(signed) ? signed : null;
      }

      function moneyInput(cents) {
        return (cents / 100).toFixed(2);
      }

      function formatMoney(cents) {
        return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(cents / 100);
      }

      function validCalendarDate(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
        const [y, m, d] = value.split("-").map(Number);
        const date = new Date(y, m - 1, d);
        return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d;
      }

      function formatDate(value) {
        if (!validCalendarDate(value)) return "Date unavailable";
        const [y, m, d] = value.split("-").map(Number);
        return new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", year: "numeric" }).format(new Date(y, m - 1, d));
      }

      function dateOrdinal(iso) {
        const [year, month, day] = iso.split("-").map(Number);
        return Math.floor(Date.UTC(year, month - 1, day) / 86400000);
      }

      function compareDates(a, b) {
        return dateOrdinal(a) - dateOrdinal(b);
      }

      function daysInCalendarMonth(year, month) {
        return new Date(Date.UTC(year, month, 0)).getUTCDate();
      }

      function addAnchoredMonths(anchorISO, months) {
        const [anchorYear, anchorMonth, anchorDay] = anchorISO.split("-").map(Number);
        const absoluteMonth = anchorYear * 12 + (anchorMonth - 1) + months;
        const year = Math.floor(absoluteMonth / 12);
        const monthIndex = ((absoluteMonth % 12) + 12) % 12;
        const day = Math.min(anchorDay, daysInCalendarMonth(year, monthIndex + 1));
        return [year, String(monthIndex + 1).padStart(2, "0"), String(day).padStart(2, "0")].join("-");
      }

      function expandEntryOccurrences(entry, startDate, endDate) {
        if (entry.frequency === "one-time") {
          return compareDates(entry.nextDate, startDate) >= 0 && compareDates(entry.nextDate, endDate) <= 0 ? [entry.nextDate] : [];
        }
        if (entry.frequency === "weekly" || entry.frequency === "biweekly") {
          const interval = entry.frequency === "weekly" ? 7 : 14;
          const daysToStart = dateOrdinal(startDate) - dateOrdinal(entry.nextDate);
          const jumps = daysToStart > 0 ? Math.ceil(daysToStart / interval) : 0;
          const dates = [];
          for (let date = addCalendarDays(entry.nextDate, jumps * interval); compareDates(date, endDate) <= 0; date = addCalendarDays(date, interval)) dates.push(date);
          return dates;
        }
        const [anchorYear, anchorMonth] = entry.nextDate.split("-").map(Number);
        const [startYear, startMonth] = startDate.split("-").map(Number);
        let monthOffset = Math.max(0, (startYear - anchorYear) * 12 + startMonth - anchorMonth);
        let date = addAnchoredMonths(entry.nextDate, monthOffset);
        while (compareDates(date, startDate) < 0) date = addAnchoredMonths(entry.nextDate, ++monthOffset);
        const dates = [];
        while (compareDates(date, endDate) <= 0) {
          dates.push(date);
          date = addAnchoredMonths(entry.nextDate, ++monthOffset);
        }
        return dates;
      }

      function occurrenceId(type, sourceId, date) {
        return type + "|" + sourceId + "|" + date;
      }

      function splitCents(totalCents, people) {
        const base = Math.floor(totalCents / people);
        const remainder = totalCents % people;
        return Array.from({ length: people }, (_, index) => base + (index < remainder ? 1 : 0));
      }

      function calculateForecast(plan, durationDays, incomeMode = "expected") {
        if (!plan || !Number.isInteger(durationDays) || durationDays < 1) throw new Error("Forecast duration must be a positive whole number.");
        const startDate = plan.planningStartDate;
        const endDate = addCalendarDays(startDate, durationDays - 1);
        const transactions = [];
        plan.incomes.forEach(entry => {
          if (incomeMode === "confirmed" && entry.status === "estimated") return;
          expandEntryOccurrences(entry, startDate, endDate).forEach(date => transactions.push({
            date,
            type: "income",
            sourceId: entry.id,
            label: entry.label,
            category: "Income",
            status: entry.status,
            amountCents: entry.amountCents,
            signedCents: entry.amountCents,
            occurrenceId: occurrenceId("income", entry.id, date)
          }));
        });
        plan.expenses.forEach(entry => {
          expandEntryOccurrences(entry, startDate, endDate).forEach(date => transactions.push({
            date,
            type: "expense",
            sourceId: entry.id,
            label: entry.label,
            category: entry.category,
            status: null,
            amountCents: entry.amountCents,
            signedCents: -entry.amountCents,
            occurrenceId: occurrenceId("expense", entry.id, date)
          }));
        });
        (plan.goals || []).forEach(goal => (goal.contributions || []).forEach(entry => {
          expandEntryOccurrences(entry, startDate, endDate).forEach(date => transactions.push({
            date,
            type: "expense",
            sourceType: "contribution",
            sourceId: entry.id,
            goalId: goal.id,
            label: entry.label || goal.name + " transfer",
            category: "Savings transfer",
            status: null,
            amountCents: entry.amountCents,
            signedCents: -entry.amountCents,
            occurrenceId: occurrenceId("contribution", entry.id, date),
            transferToSavings: true
          }));
        }));
        return buildForecastFromTransactions(plan, durationDays, incomeMode, transactions, []);
      }

      function calculateGoalProjection(plan, goal, forecast) {
        const transfers = forecast.transactions.filter(transaction => transaction.transferToSavings && transaction.goalId === goal.id);
        let projectedCents = goal.savedCents;
        let reachedDate = goal.savedCents >= goal.targetCents ? forecast.startDate : null;
        transfers.forEach(transaction => {
          projectedCents += transaction.amountCents;
          if (!reachedDate && projectedCents >= goal.targetCents) reachedDate = transaction.date;
        });
        return { actualCents: goal.savedCents, projectedCents, remainingCents: Math.max(0, goal.targetCents - projectedCents), reachedDate, transferCents: projectedCents - goal.savedCents };
      }

      function buildForecastFromTransactions(plan, durationDays, incomeMode, sourceTransactions, issues = []) {
        const startDate = plan.planningStartDate;
        const endDate = addCalendarDays(startDate, durationDays - 1);
        const transactions = sourceTransactions.map(transaction => ({ ...transaction }));
        transactions.sort((a, b) => compareDates(a.date, b.date) || (a.type === b.type ? a.label.localeCompare(b.label) : a.type === "income" ? -1 : 1));
        const byDate = new Map();
        transactions.forEach(transaction => {
          if (!byDate.has(transaction.date)) byDate.set(transaction.date, []);
          byDate.get(transaction.date).push(transaction);
        });
        const days = [];
        let balance = plan.availableBalanceCents;
        for (let index = 0; index < durationDays; index += 1) {
          const date = addCalendarDays(startDate, index);
          const dailyTransactions = byDate.get(date) || [];
          const openingBalanceCents = balance;
          const incomeCents = dailyTransactions.filter(item => item.type === "income").reduce((sum, item) => sum + item.amountCents, 0);
          const expenseCents = dailyTransactions.filter(item => item.type === "expense").reduce((sum, item) => sum + item.amountCents, 0);
          balance = openingBalanceCents + incomeCents - expenseCents;
          days.push({ date, openingBalanceCents, incomeCents, expenseCents, closingBalanceCents: balance, transactions: dailyTransactions });
        }
        const balanceCandidates = [{ date: startDate, balanceCents: plan.availableBalanceCents, isStartingBalance: true }].concat(days.map(day => ({ date: day.date, balanceCents: day.closingBalanceCents, isStartingBalance: false })));
        const minimumCents = Math.min(...balanceCandidates.map(item => item.balanceCents));
        const lowest = balanceCandidates.find(item => item.balanceCents === minimumCents);
        const firstBelowCushion = balanceCandidates.find(item => item.balanceCents < plan.cushionCents) || null;
        const firstBelowZero = balanceCandidates.find(item => item.balanceCents < 0) || null;
        const additionalSpendingRoomCents = Math.max(0, minimumCents - plan.cushionCents);
        const closingByDate = new Map(days.map(day => [day.date, day.closingBalanceCents]));
        const datedTransactions = transactions.map(transaction => ({ ...transaction, closingBalanceCents: closingByDate.get(transaction.date) }));
        return {
          startDate,
          endDate,
          durationDays,
          incomeMode,
          startingBalanceCents: plan.availableBalanceCents,
          cushionCents: plan.cushionCents,
          days,
          transactions: datedTransactions,
          lowest: { date: lowest.date, balanceCents: lowest.balanceCents, isStartingBalance: lowest.isStartingBalance },
          firstBelowCushion,
          firstBelowZero,
          additionalSpendingRoomCents,
          daysBelowCushion: days.filter(day => day.closingBalanceCents < plan.cushionCents).length,
          daysBelowZero: days.filter(day => day.closingBalanceCents < 0).length,
          endingBalanceCents: days[days.length - 1].closingBalanceCents,
          issues
        };
      }

      function calculateScenarioComparison(plan, durationDays, incomeMode, scenario) {
        const baseline = calculateForecast(plan, durationDays, incomeMode);
        let transactions = baseline.transactions.map(({ closingBalanceCents, ...transaction }) => ({ ...transaction }));
        const issues = [];
        const claimedOccurrences = new Set();
        const claimedHousing = new Set();
        const claimedContributions = new Set();
        const startDate = baseline.startDate;
        const endDate = baseline.endDate;
        const changes = scenario && Array.isArray(scenario.changes) ? scenario.changes : [];
        changes.forEach(change => {
          if (change.type === "purchase") {
            if (compareDates(change.date, startDate) < 0 || compareDates(change.date, endDate) > 0) {
              issues.push({ changeId: change.id, level: "info", message: "The purchase is outside this forecast, so it has no effect within the selected period." });
              return;
            }
            transactions.push({ date: change.date, type: "expense", sourceId: "scenario:" + change.id, label: change.description, category: "Hypothetical purchase", status: null, amountCents: change.amountCents, signedCents: -change.amountCents, occurrenceId: "scenario-purchase|" + change.id + "|" + change.date, hypothetical: true, changeId: change.id });
            return;
          }
          if (change.type === "paycheck-change" || change.type === "paycheck-delay") {
            const source = plan.incomes.find(entry => entry.id === change.sourceId);
            const targetKey = occurrenceId("income", change.sourceId, change.occurrenceDate);
            if (!source) {
              issues.push({ changeId: change.id, level: "error", message: "This paycheck’s original income entry no longer exists. The change was not applied." });
              return;
            }
            if (incomeMode === "confirmed" && source.status === "estimated") {
              issues.push({ changeId: change.id, level: "info", message: "This estimated paycheck is excluded from the confirmed-only view, so this change is inactive here." });
              return;
            }
            if (claimedOccurrences.has(targetKey)) {
              issues.push({ changeId: change.id, level: "error", message: "Another change already targets this paycheck occurrence. This conflicting change was not applied." });
              return;
            }
            const index = transactions.findIndex(transaction => transaction.occurrenceId === targetKey);
            if (index < 0) {
              issues.push({ changeId: change.id, level: "error", message: "This paycheck occurrence no longer matches the current plan. The change was not applied." });
              return;
            }
            claimedOccurrences.add(targetKey);
            if (change.type === "paycheck-change") {
              transactions[index] = { ...transactions[index], amountCents: change.amountCents, signedCents: change.amountCents, hypothetical: true, changeId: change.id };
            } else {
              const moved = { ...transactions[index], date: change.newDate, occurrenceId: targetKey + "|moved", hypothetical: true, changeId: change.id };
              transactions.splice(index, 1);
              if (compareDates(change.newDate, startDate) < 0 || compareDates(change.newDate, endDate) > 0) {
                issues.push({ changeId: change.id, level: "info", message: "The delayed paycheck moves outside this forecast and no longer contributes within the selected period." });
              } else {
                transactions.push(moved);
              }
            }
            return;
          }
          if (change.type === "housing-change") {
            const source = plan.expenses.find(entry => entry.id === change.sourceId);
            if (!source || source.category !== "Housing" || source.frequency === "one-time") {
              issues.push({ changeId: change.id, level: "error", message: "This recurring housing entry no longer matches the current plan. The change was not applied." });
              return;
            }
            if (claimedHousing.has(change.sourceId)) {
              issues.push({ changeId: change.id, level: "error", message: "Another change already updates this housing entry. This conflicting change was not applied." });
              return;
            }
            claimedHousing.add(change.sourceId);
            let replaced = 0;
            transactions = transactions.map(transaction => {
              if (transaction.type === "expense" && transaction.sourceId === change.sourceId && compareDates(transaction.date, change.effectiveDate) >= 0) {
                replaced += 1;
                return { ...transaction, amountCents: change.amountCents, signedCents: -change.amountCents, hypothetical: true, changeId: change.id };
              }
              return transaction;
            });
            if (!replaced) issues.push({ changeId: change.id, level: "info", message: "The housing change has no recurring occurrence inside this forecast after its effective date." });
            if (change.movingCostCents > 0) {
              if (compareDates(change.effectiveDate, startDate) >= 0 && compareDates(change.effectiveDate, endDate) <= 0) {
                transactions.push({ date: change.effectiveDate, type: "expense", sourceId: "scenario:" + change.id, label: "One-time moving cost", category: "Housing", status: null, amountCents: change.movingCostCents, signedCents: -change.movingCostCents, occurrenceId: "scenario-moving|" + change.id + "|" + change.effectiveDate, hypothetical: true, changeId: change.id });
              } else {
                issues.push({ changeId: change.id, level: "info", message: "The one-time moving cost falls outside this forecast and has no effect here." });
              }
            }
            return;
          }
          if (change.type === "contribution-change") {
            const goal = (plan.goals || []).find(item => item.id === change.goalId);
            const contribution = goal && (goal.contributions || []).find(item => item.id === change.sourceId);
            const targetKey = occurrenceId("contribution", change.sourceId, change.occurrenceDate);
            if (!contribution) {
              issues.push({ changeId: change.id, level: "error", message: "This savings contribution no longer exists. The change was not applied." });
              return;
            }
            if (claimedContributions.has(targetKey)) {
              issues.push({ changeId: change.id, level: "error", message: "Another change already targets this contribution occurrence." });
              return;
            }
            const index = transactions.findIndex(transaction => transaction.occurrenceId === targetKey && transaction.goalId === change.goalId);
            if (index < 0) {
              issues.push({ changeId: change.id, level: "error", message: "This contribution occurrence is outside the current forecast or no longer matches the plan." });
              return;
            }
            claimedContributions.add(targetKey);
            transactions[index] = { ...transactions[index], amountCents: change.amountCents, signedCents: -change.amountCents, hypothetical: true, changeId: change.id };
          }
        });
        const scenarioForecast = buildForecastFromTransactions(plan, durationDays, incomeMode, transactions, issues);
        return { baseline, scenario: scenarioForecast, issues };
      }

      function titleCase(value) {
        return value.replace(/(^|-)(\w)/g, (_, sep, letter) => (sep ? " " : "") + letter.toUpperCase());
      }

      function isPlainObject(value) {
        return value !== null && typeof value === "object" && !Array.isArray(value);
      }

      function validateScenario(scenario, scenarioIndex) {
        const errors = [];
        const prefix = "Scenario " + (scenarioIndex + 1) + ": ";
        if (!isPlainObject(scenario) || typeof scenario.id !== "string" || !scenario.id || typeof scenario.name !== "string" || !scenario.name.trim() || scenario.name.length > 60 || !["", "essential", "flexible", "wait"].includes(scenario.reflection) || !Array.isArray(scenario.changes) || scenario.changes.length > 20) return [prefix + "the scenario structure is invalid."];
        const occurrenceTargets = new Set();
        const housingTargets = new Set();
        scenario.changes.forEach((change, changeIndex) => {
          const changePrefix = prefix + "change " + (changeIndex + 1) + " is invalid.";
          if (!isPlainObject(change) || typeof change.id !== "string" || !change.id || !["purchase", "paycheck-change", "paycheck-delay", "housing-change", "contribution-change"].includes(change.type)) { errors.push(changePrefix); return; }
          if (change.type === "purchase") {
            if (typeof change.description !== "string" || !change.description.trim() || change.description.length > 100 || !Number.isSafeInteger(change.amountCents) || change.amountCents <= 0 || !validCalendarDate(change.date)) errors.push(changePrefix);
          } else if (change.type === "paycheck-change") {
            if (typeof change.sourceId !== "string" || !change.sourceId || !validCalendarDate(change.occurrenceDate) || !Number.isSafeInteger(change.amountCents) || change.amountCents < 0) errors.push(changePrefix);
          } else if (change.type === "paycheck-delay") {
            if (typeof change.sourceId !== "string" || !change.sourceId || !validCalendarDate(change.occurrenceDate) || !validCalendarDate(change.newDate)) errors.push(changePrefix);
          } else if (change.type === "housing-change") {
            if (typeof change.sourceId !== "string" || !change.sourceId || !Number.isSafeInteger(change.amountCents) || change.amountCents < 0 || !validCalendarDate(change.effectiveDate) || !Number.isSafeInteger(change.movingCostCents) || change.movingCostCents < 0) errors.push(changePrefix);
          } else if (change.type === "contribution-change") {
            if (typeof change.goalId !== "string" || !change.goalId || typeof change.sourceId !== "string" || !change.sourceId || !validCalendarDate(change.occurrenceDate) || !Number.isSafeInteger(change.amountCents) || change.amountCents < 0) errors.push(changePrefix);
          }
          if (change.type === "paycheck-change" || change.type === "paycheck-delay") {
            const key = change.sourceId + "|" + change.occurrenceDate;
            if (occurrenceTargets.has(key)) errors.push(prefix + "multiple changes target the same paycheck occurrence.");
            occurrenceTargets.add(key);
          }
          if (change.type === "housing-change") {
            if (housingTargets.has(change.sourceId)) errors.push(prefix + "multiple changes target the same housing entry.");
            housingTargets.add(change.sourceId);
          }
        });
        return errors;
      }

      function validatePlan(input) {
        const errors = [];
        if (!isPlainObject(input)) return { valid: false, errors: ["The file does not contain a plan object."] };
        if (input.schemaVersion !== SCHEMA_VERSION) errors.push("The plan version is not supported.");
        if (typeof input.nickname !== "string" || input.nickname.length > 60) errors.push("Nickname must be text under 60 characters.");
        if (!Number.isSafeInteger(input.availableBalanceCents)) errors.push("availableBalanceCents must be a whole number of cents.");
        if (!Number.isSafeInteger(input.cushionCents) || input.cushionCents < 0) errors.push("cushionCents must be a non-negative amount in cents.");
        if (!validCalendarDate(input.planningStartDate)) errors.push("Planning start date is invalid.");
        if (!Array.isArray(input.incomes) || input.incomes.length > 100) errors.push("Income entries are invalid or exceed 100 entries.");
        if (!Array.isArray(input.expenses) || input.expenses.length > 100) errors.push("Expense entries are invalid or exceed 100 entries.");
        if (Array.isArray(input.incomes)) input.incomes.forEach((item, index) => {
          if (!isPlainObject(item) || typeof item.id !== "string" || typeof item.label !== "string" || !item.label.trim() || item.label.length > 80 || !Number.isSafeInteger(item.amountCents) || item.amountCents < 0 || !validCalendarDate(item.nextDate) || !frequencies.includes(item.frequency) || !incomeStatuses.includes(item.status)) errors.push("Income entry " + (index + 1) + " is invalid.");
        });
        if (Array.isArray(input.expenses)) input.expenses.forEach((item, index) => {
          if (!isPlainObject(item) || typeof item.id !== "string" || typeof item.label !== "string" || !item.label.trim() || item.label.length > 80 || !Number.isSafeInteger(item.amountCents) || item.amountCents < 0 || !validCalendarDate(item.nextDate) || !frequencies.includes(item.frequency) || !expenseCategories.includes(item.category) || (item.sharedCostId !== undefined && (typeof item.sharedCostId !== "string" || !item.sharedCostId))) errors.push("Expense entry " + (index + 1) + " is invalid.");
        });
        if (input.savingsGoal !== null && input.savingsGoal !== undefined) {
          const goal = input.savingsGoal;
          if (!isPlainObject(goal) || typeof goal.name !== "string" || !goal.name.trim() || goal.name.length > 80 || !Number.isSafeInteger(goal.targetCents) || goal.targetCents <= 0 || !Number.isSafeInteger(goal.savedCents) || goal.savedCents < 0) errors.push("Savings goal is invalid.");
        }
        if (input.scenarios !== undefined) {
          if (!Array.isArray(input.scenarios) || input.scenarios.length > 3) errors.push("Saved scenarios are invalid or exceed three scenarios.");
          else input.scenarios.forEach((scenario, index) => errors.push(...validateScenario(scenario, index)));
        }
        if (input.goals !== undefined) {
          if (!Array.isArray(input.goals) || input.goals.length > 3) errors.push("Goals are invalid or exceed three goals.");
          else {
            const contributionIds = new Set();
            input.goals.forEach((goal, index) => {
              if (!isPlainObject(goal) || typeof goal.id !== "string" || !goal.id || typeof goal.name !== "string" || !goal.name.trim() || goal.name.length > 80 || !Number.isSafeInteger(goal.targetCents) || goal.targetCents <= 0 || !Number.isSafeInteger(goal.savedCents) || goal.savedCents < 0 || (goal.targetDate !== null && goal.targetDate !== undefined && !validCalendarDate(goal.targetDate)) || !Array.isArray(goal.contributions) || goal.contributions.length > 50) { errors.push("Goal " + (index + 1) + " is invalid."); return; }
              goal.contributions.forEach((entry, contributionIndex) => {
                if (!isPlainObject(entry) || typeof entry.id !== "string" || !entry.id || contributionIds.has(entry.id) || typeof entry.label !== "string" || !entry.label.trim() || entry.label.length > 80 || !Number.isSafeInteger(entry.amountCents) || entry.amountCents < 0 || !validCalendarDate(entry.nextDate) || !frequencies.includes(entry.frequency)) errors.push("Goal " + (index + 1) + " contribution " + (contributionIndex + 1) + " is invalid.");
                contributionIds.add(entry.id);
              });
            });
          }
        }
        if (input.sharedCosts !== undefined) {
          if (!Array.isArray(input.sharedCosts) || input.sharedCosts.length > 50) errors.push("Shared costs are invalid or exceed 50 entries.");
          else input.sharedCosts.forEach((item, index) => {
            const validMode = item && ["equal", "custom"].includes(item.splitMode);
            const allocations = validMode && item.splitMode === "equal" && Number.isInteger(item.people) && item.people >= 2 ? splitCents(item.totalCents, item.people) : [];
            if (!isPlainObject(item) || typeof item.id !== "string" || !item.id || typeof item.label !== "string" || !item.label.trim() || item.label.length > 80 || !Number.isSafeInteger(item.totalCents) || item.totalCents < 0 || !validCalendarDate(item.nextDate) || !frequencies.includes(item.frequency) || !expenseCategories.includes(item.category) || !validMode || !Number.isInteger(item.people) || item.people < 2 || item.people > 20 || !Number.isSafeInteger(item.shareCents) || item.shareCents < 0 || item.shareCents > item.totalCents || (item.splitMode === "equal" && item.shareCents !== allocations[0]) || (item.linkedExpenseId !== null && item.linkedExpenseId !== undefined && typeof item.linkedExpenseId !== "string")) errors.push("Shared cost " + (index + 1) + " is invalid.");
          });
        }
        if (Array.isArray(input.sharedCosts) && Array.isArray(input.expenses)) input.sharedCosts.forEach(item => {
          if (!item.linkedExpenseId) return;
          const linked = input.expenses.find(expense => expense.id === item.linkedExpenseId);
          if (!linked || linked.sharedCostId !== item.id || linked.amountCents !== item.shareCents) errors.push("A shared cost has a broken or mismatched linked expense.");
        });
        if (Array.isArray(input.incomes) && new Set(input.incomes.map(item => item.id)).size !== input.incomes.length) errors.push("Income entry IDs must be unique.");
        if (Array.isArray(input.expenses) && new Set(input.expenses.map(item => item.id)).size !== input.expenses.length) errors.push("Expense entry IDs must be unique.");
        if (Array.isArray(input.goals) && new Set(input.goals.map(item => item.id)).size !== input.goals.length) errors.push("Goal IDs must be unique.");
        if (Array.isArray(input.sharedCosts) && new Set(input.sharedCosts.map(item => item.id)).size !== input.sharedCosts.length) errors.push("Shared-cost IDs must be unique.");
        if (Array.isArray(input.sharedCosts)) {
          const linkedIds = input.sharedCosts.map(item => item.linkedExpenseId).filter(Boolean);
          if (new Set(linkedIds).size !== linkedIds.length) errors.push("A personal expense cannot be linked to more than one shared cost.");
        }
        if (Array.isArray(input.expenses) && Array.isArray(input.sharedCosts)) input.expenses.filter(expense => expense.sharedCostId).forEach(expense => {
          const shared = input.sharedCosts.find(item => item.id === expense.sharedCostId);
          if (!shared || shared.linkedExpenseId !== expense.id) errors.push("A linked expense has no matching shared cost.");
        });
        if (Array.isArray(input.scenarios) && Array.isArray(input.goals)) input.scenarios.forEach(scenario => scenario.changes.filter(change => change.type === "contribution-change").forEach(change => {
          const goal = input.goals.find(item => item.id === change.goalId);
          if (!goal || !goal.contributions.some(entry => entry.id === change.sourceId)) errors.push("A savings-contribution scenario has no matching goal transfer.");
        }));
        return { valid: errors.length === 0, errors };
      }

      function clonePlan(plan) {
        return JSON.parse(JSON.stringify(plan));
      }

      function normalizePlan(plan) {
        const normalized = clonePlan(plan);
        if (!Array.isArray(normalized.scenarios)) normalized.scenarios = [];
        if (!Array.isArray(normalized.goals)) normalized.goals = [];
        if (normalized.savingsGoal && normalized.goals.length === 0) normalized.goals.push({ id: "goal_legacy", name: normalized.savingsGoal.name, targetCents: normalized.savingsGoal.targetCents, savedCents: normalized.savingsGoal.savedCents, targetDate: null, contributions: [] });
        normalized.goals = normalized.goals.map(goal => ({ ...goal, targetDate: goal.targetDate || null, contributions: Array.isArray(goal.contributions) ? goal.contributions : [] }));
        normalized.savingsGoal = null;
        if (!Array.isArray(normalized.sharedCosts)) normalized.sharedCosts = [];
        return normalized;
      }

      function saveLocal() {
        if (!storageAvailable) return;
        try {
          if (!state.plan) {
            localStorage.removeItem(STORAGE_KEY);
            return;
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ plan: state.plan, dirty: state.dirty, planDirty: state.planDirty, scenarioDraft: state.scenarioDraft, scenarioDraftBaseline: state.scenarioDraftBaseline, scenarioDraftDirty: state.scenarioDraftDirty, activeScenarioId: state.activeScenarioId }));
        } catch (_) {
          storageAvailable = false;
          showToast("Browser storage is unavailable. Download your plan file to keep a copy.", true);
        }
      }

      function loadLocal() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const stored = JSON.parse(raw);
          const result = validatePlan(stored.plan);
          if (!result.valid) throw new Error("Stored data is invalid");
          state.plan = normalizePlan(stored.plan);
          state.planDirty = stored.planDirty === undefined ? Boolean(stored.dirty) : Boolean(stored.planDirty);
          if (stored.scenarioDraft && validateScenario(stored.scenarioDraft, 0).length === 0) {
            state.scenarioDraft = stored.scenarioDraft;
            state.scenarioDraftBaseline = stored.scenarioDraftBaseline || clonePlan(stored.scenarioDraft);
            state.scenarioDraftDirty = Boolean(stored.scenarioDraftDirty);
            state.activeScenarioId = typeof stored.activeScenarioId === "string" ? stored.activeScenarioId : null;
          }
          state.dirty = state.planDirty || state.scenarioDraftDirty;
          state.screen = "app";
        } catch (_) {
          try { localStorage.removeItem(STORAGE_KEY); } catch (_) { storageAvailable = false; }
          showToast("Saved browser data could not be opened, so it was left out.", true);
        }
      }

      function markDirty(preserveDemo = false) {
        state.planDirty = true;
        state.dirty = true;
        if (state.plan) {
          if (!preserveDemo) {
            delete state.plan.demoStory;
            state.plan.demo = false;
          }
          state.plan.updatedAt = new Date().toISOString();
        }
        saveLocal();
      }

      function markScenarioDraftDirty() {
        state.scenarioDraftDirty = true;
        state.dirty = true;
        if (state.scenarioDraft) state.scenarioDraft.updatedAt = new Date().toISOString();
        saveLocal();
      }

      function formatShortDate(value) {
