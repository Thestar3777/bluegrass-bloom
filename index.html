      function renderGoalDisplay() {
        const container = document.getElementById("goal-display");
        if (!container) return;
        const goal = state.plan.goals[0];
        if (!goal) {
          const empty = el("div", "empty-state");
          empty.append(el("strong", "", "No savings goal yet"), el("span", "", "Add up to three goals and connect planned transfers."));
          const button = el("button", "button primary", "Create a goal");
          button.type = "button";
          button.dataset.view = "goals";
          empty.append(button);
          container.replaceChildren(empty);
          return;
        }
        const calc = calculateGoal(goal);
        const top = el("div", "goal-top");
        top.append(el("div", "goal-name", goal.name), el("div", "goal-number", calc.percent + "% complete"));
        const track = el("div", "progress-track");
        track.setAttribute("role", "progressbar");
        track.setAttribute("aria-valuenow", String(calc.percent));
        track.setAttribute("aria-valuemin", "0");
        track.setAttribute("aria-valuemax", "100");
        track.setAttribute("aria-label", goal.name + " savings progress");
        const fill = el("div", "progress-fill");
        fill.style.width = calc.percent + "%";
        track.append(fill);
        const copy = el("div", "progress-copy", formatMoney(goal.savedCents) + " saved · " + formatMoney(calc.remainingCents) + " remaining toward " + formatMoney(goal.targetCents));
        container.replaceChildren(top, track, copy);
      }

      function refineForecastAssumptions() {
        const note = document.querySelector(".forecast-note");
        if (!note) return;
        note.replaceChildren(el("span", "forecast-note-icon", "i"), el("div", "", state.forecastIncomeMode === "expected" ? "Expected view includes confirmed and estimated income; every entered expense remains included." : "Confirmed-only view excludes estimated income; every entered expense remains included."));
        const details = el("details", "forecast-assumptions");
        const summary = el("summary", "", "How this forecast works");
        const copy = el("div", "", "The starting balance is available before the first day’s transactions. Same-day income is assumed available before expenses, though actual bank timing may differ. The cushion is a comparison threshold, not an expense. Savings held outside the available balance is excluded. Switching income views does not change saved entries.");
        details.append(summary, copy);
        note.after(details);
      }

      function renderApp() {
        const content = state.view === "overview" ? overviewMarkup() : state.view === "forecast" ? forecastMarkup() : state.view === "lab" ? labMarkup() : state.view === "goals" ? goalsMarkup() : planMarkup();
        app.innerHTML = appChrome(content);
        document.querySelectorAll("#income-list").forEach(node => renderEntryList(node, "income"));
        document.querySelectorAll("#expense-list").forEach(node => renderEntryList(node, "expense"));
        renderGoalDisplay();
        if (state.view === "forecast") {
          refineForecastAssumptions();
          renderUpcomingList();
          setupForecastChart();
        }
        if (state.view === "lab") {
          decorateLabResults();
          renderScenarioChanges();
          setupLabChart();
          if (state.scenarioEditingChangeId) {
            const change = state.scenarioDraft.changes.find(item => item.id === state.scenarioEditingChangeId);
            const formIds = { purchase: "purchase-form", "paycheck-change": "paycheck-change-form", "paycheck-delay": "paycheck-delay-form", "housing-change": "housing-change-form", "contribution-change": "contribution-change-form" };
            const form = change ? document.getElementById(formIds[change.type]) : null;
            if (form && form.closest("details")) form.closest("details").open = true;
          }
        }
      }

      function render() {
        if (state.screen === "welcome") renderWelcome();
        else if (state.screen === "onboarding") renderOnboarding();
        else renderApp();
      }

      function showFieldError(id, message) {
        const input = document.getElementById(id);
        const error = document.getElementById(id + "-error");
        if (input) input.setAttribute("aria-invalid", "true");
        if (error) error.textContent = message;
      }

      function clearFormErrors(form) {
        form.querySelectorAll('[aria-invalid="true"]').forEach(input => input.removeAttribute("aria-invalid"));
        form.querySelectorAll(".field-error").forEach(node => node.textContent = "");
      }

      function readBasics(form) {
        clearFormErrors(form);
        const balance = parseBalanceMoney(form.elements.availableBalance.value);
        const cushion = parseMoney(form.elements.cushion.value);
        let valid = true;
        if (balance === null) { showFieldError("availableBalance", "Enter an amount with up to two decimal places. Use a minus sign if overdrawn."); valid = false; }
        if (cushion === null) { showFieldError("cushion", "Enter a non-negative amount with up to two decimal places."); valid = false; }
        if (!validCalendarDate(form.elements.planningStartDate.value)) { showFieldError("planningStartDate", "Choose a valid calendar date."); valid = false; }
        if (form.elements.nickname.value.trim().length > 60) { showFieldError("nickname", "Use 60 characters or fewer."); valid = false; }
        if (!valid) return false;
        state.plan.nickname = form.elements.nickname.value.trim();
        state.plan.availableBalanceCents = balance;
        state.plan.cushionCents = cushion;
        state.plan.planningStartDate = form.elements.planningStartDate.value;
        markDirty();
        return true;
      }

      function readGoal(form) {
        clearFormErrors(form);
        const name = form.elements.goalName.value.trim();
        const targetRaw = form.elements.goalTarget.value.trim();
        const savedRaw = form.elements.goalSaved.value.trim();
        if (!name && !targetRaw && !savedRaw) {
          state.plan.goals = [];
          markDirty();
          return true;
        }
        let valid = true;
        const target = parseMoney(targetRaw);
        const saved = parseMoney(savedRaw || "0");
        if (!name) { showFieldError("goalName", "Add a name, or leave all goal fields blank."); valid = false; }
        if (name.length > 80) { showFieldError("goalName", "Use 80 characters or fewer."); valid = false; }
        if (target === null || target <= 0) { showFieldError("goalTarget", "Enter a target greater than zero."); valid = false; }
        if (saved === null) { showFieldError("goalSaved", "Enter a non-negative amount."); valid = false; }
        if (!valid) return false;
        const existing = state.plan.goals[0];
        state.plan.goals = [{ id: existing ? existing.id : createId("goal"), name, targetCents: target, savedCents: saved, targetDate: existing ? existing.targetDate : null, contributions: existing ? existing.contributions : [] }];
        markDirty();
        return true;
      }

      function openEntryDialog(type, id = null) {
        const collection = type === "income" ? state.plan.incomes : state.plan.expenses;
        const item = id ? collection.find(entry => entry.id === id) : null;
        if (type === "expense" && item && item.sharedCostId) {
          state.sharedEditorId = item.sharedCostId;
          state.view = "plan";
          render();
          showToast("Edit this linked expense from its shared cost so the split stays synchronized.");
          return;
        }
        state.entryEditor = { type, id };
        document.getElementById("entry-dialog-kicker").textContent = type === "income" ? "Expected take-home" : "Your share of the cost";
        document.getElementById("entry-dialog-title").textContent = (item ? "Edit " : "Add ") + type;
        const value = item || (type === "income" ? { label: "", amountCents: 0, nextDate: state.plan.planningStartDate, frequency: "one-time", status: "estimated" } : { label: "", amountCents: 0, nextDate: state.plan.planningStartDate, frequency: "one-time", category: "Other" });
        const extra = type === "income" ? fieldMarkup("entryStatus", "Status", "select", value.status, { choices: incomeStatuses, hint: "Use estimated when an amount may vary." }) : fieldMarkup("entryCategory", "Category", "select", value.category, { choices: expenseCategories, labels: Object.fromEntries(expenseCategories.map(c => [c, c])) });
        document.getElementById("entry-form-fields").innerHTML = fieldMarkup("entryLabel", "Label", "text", value.label, { maxlength: 80, span: true, placeholder: type === "income" ? "For example, café shifts" : "For example, my share of rent" }) + fieldMarkup("entryAmount", "Amount", "text", item ? moneyInput(item.amountCents) : "", { placeholder: "0.00" }) + fieldMarkup("entryDate", "Next date", "date", value.nextDate) + fieldMarkup("entryFrequency", "Frequency", "select", value.frequency, { choices: frequencies }) + extra;
        dialog.showModal();
        window.setTimeout(() => document.getElementById("entryLabel").focus(), 0);
      }

      function saveEntry(form) {
        clearFormErrors(form);
        const type = state.entryEditor.type;
        const label = form.elements.entryLabel.value.trim();
        const amount = parseMoney(form.elements.entryAmount.value);
        let valid = true;
        if (!label) { showFieldError("entryLabel", "Add a short label."); valid = false; }
        if (label.length > 80) { showFieldError("entryLabel", "Use 80 characters or fewer."); valid = false; }
        if (amount === null || amount <= 0) { showFieldError("entryAmount", "Enter an amount greater than zero with up to two decimal places."); valid = false; }
        if (!validCalendarDate(form.elements.entryDate.value)) { showFieldError("entryDate", "Choose a valid calendar date."); valid = false; }
        if (!valid) return;
        const data = { label, amountCents: amount, nextDate: form.elements.entryDate.value, frequency: form.elements.entryFrequency.value };
        if (type === "income") data.status = form.elements.entryStatus.value;
        else data.category = form.elements.entryCategory.value;
        const collection = type === "income" ? state.plan.incomes : state.plan.expenses;
        if (state.entryEditor.id) {
          const index = collection.findIndex(item => item.id === state.entryEditor.id);
          collection[index] = { ...collection[index], ...data };
        } else {
          collection.push({ id: createId(type === "income" ? "inc" : "exp"), ...data });
        }
        markDirty();
        dialog.close();
        render();
        showToast((state.entryEditor.id ? "Updated " : "Added ") + type + " entry.");
      }

      async function deleteEntry(type, id, trigger = null) {
        const collection = type === "income" ? state.plan.incomes : state.plan.expenses;
        const item = collection.find(entry => entry.id === id);
        if (!item || !await requestDecision({ title: "Delete this entry?", message: 'Delete "' + item.label + '" from your money plan?', confirmLabel: "Delete entry", trigger })) return;
        const index = collection.findIndex(entry => entry.id === id);
        collection.splice(index, 1);
        if (type === "expense") state.plan.sharedCosts.forEach(shared => { if (shared.linkedExpenseId === id) shared.linkedExpenseId = null; });
        markDirty();
        render();
        showToast("Entry deleted.");
      }

      function linkSharedExpense(shared, existingExpenseId = null) {
        let expense = existingExpenseId ? state.plan.expenses.find(item => item.id === existingExpenseId) : null;
        if (!expense && shared.linkedExpenseId) expense = state.plan.expenses.find(item => item.id === shared.linkedExpenseId);
        if (!expense) {
          expense = { id: createId("exp"), label: "My share of " + shared.label, amountCents: shared.shareCents, nextDate: shared.nextDate, frequency: shared.frequency, category: shared.category, sharedCostId: shared.id };
          state.plan.expenses.push(expense);
        } else Object.assign(expense, { label: "My share of " + shared.label, amountCents: shared.shareCents, nextDate: shared.nextDate, frequency: shared.frequency, category: shared.category, sharedCostId: shared.id });
        shared.linkedExpenseId = expense.id;
      }

      function saveSharedCost(form) {
        clearFormErrors(form);
        const label = form.elements.sharedLabel.value.trim();
        const totalCents = parseMoney(form.elements.sharedTotal.value);
        const splitMode = form.elements.sharedMode.value;
        const people = splitMode === "equal" ? Number(form.elements.sharedPeople.value) : 2;
        const customShare = parseMoney(form.elements.sharedShare.value.trim() || "0");
        let valid = true;
        if (!label || label.length > 80) { showFieldError("sharedLabel", "Use a label between 1 and 80 characters."); valid = false; }
        if (totalCents === null) { showFieldError("sharedTotal", "Enter a non-negative household total."); valid = false; }
        if (!validCalendarDate(form.elements.sharedDate.value)) { showFieldError("sharedDate", "Choose a valid date."); valid = false; }
        if (splitMode === "equal" && (!Number.isInteger(people) || people < 2 || people > 20)) { showFieldError("sharedPeople", "Enter 2 to 20 people, including you."); valid = false; }
        if (splitMode === "custom" && (customShare === null || (totalCents !== null && customShare > totalCents))) { showFieldError("sharedShare", "Enter your share, no more than the household total."); valid = false; }
        if (!valid) return;
        const shareCents = splitMode === "equal" ? splitCents(totalCents, people)[0] : customShare;
        const existing = state.sharedEditorId !== "new" ? state.plan.sharedCosts.find(item => item.id === state.sharedEditorId) : null;
        const previousLinkedId = existing && existing.linkedExpenseId;
        const shared = { id: existing ? existing.id : createId("shared"), label, totalCents, nextDate: form.elements.sharedDate.value, frequency: form.elements.sharedFrequency.value, category: form.elements.sharedCategory.value, splitMode, people, shareCents, linkedExpenseId: previousLinkedId || null };
        if (existing) Object.assign(existing, shared); else state.plan.sharedCosts.push(shared);
        const target = existing || shared;
        const convertId = form.elements.sharedConvert.value || null;
        if (previousLinkedId && convertId !== previousLinkedId && convertId !== null) state.plan.expenses = state.plan.expenses.filter(expense => expense.id !== previousLinkedId);
        if (convertId) linkSharedExpense(target, convertId);
        else if (previousLinkedId) linkSharedExpense(target, previousLinkedId);
        state.sharedEditorId = null;
        markDirty();
        render();
        showToast(existing ? "Shared cost and linked forecast expense updated." : convertId ? "Shared cost saved and existing expense converted." : "Shared cost saved. Add your share when ready.");
      }

      async function deleteSharedCost(id, trigger = null) {
        const shared = state.plan.sharedCosts.find(item => item.id === id);
        if (!shared) return;
        const message = shared.linkedExpenseId ? 'Delete "' + shared.label + '" and its linked personal forecast expense?' : 'Delete "' + shared.label + '"?';
        if (!await requestDecision({ title: "Delete this shared cost?", message, confirmLabel: "Delete shared cost", trigger })) return;
        if (shared.linkedExpenseId) state.plan.expenses = state.plan.expenses.filter(expense => expense.id !== shared.linkedExpenseId);
        state.plan.sharedCosts = state.plan.sharedCosts.filter(item => item.id !== id);
        markDirty(); render(); showToast("Shared cost deleted.");
      }

      function saveGoalEditor(form) {
        clearFormErrors(form);
        const name = form.elements.goalEditName.value.trim();
        const targetCents = parseMoney(form.elements.goalEditTarget.value);
        const savedCents = parseMoney(form.elements.goalEditSaved.value);
        const targetDate = form.elements.goalEditDate.value || null;
        let valid = true;
        if (!name || name.length > 80) { showFieldError("goalEditName", "Use a name between 1 and 80 characters."); valid = false; }
        if (targetCents === null || targetCents <= 0) { showFieldError("goalEditTarget", "Enter a target greater than zero."); valid = false; }
        if (savedCents === null) { showFieldError("goalEditSaved", "Enter a non-negative amount."); valid = false; }
        if (targetDate && !validCalendarDate(targetDate)) { showFieldError("goalEditDate", "Choose a valid date or leave it blank."); valid = false; }
        if (!valid) return;
        const existing = state.goalEditorId !== "new" ? state.plan.goals.find(goal => goal.id === state.goalEditorId) : null;
        if (!existing && state.plan.goals.length >= 3) { showToast("You can keep up to three goals.", true); return; }
        if (existing) Object.assign(existing, { name, targetCents, savedCents, targetDate });
        else state.plan.goals.push({ id: createId("goal"), name, targetCents, savedCents, targetDate, contributions: [] });
        state.goalEditorId = null;
        markDirty(); render(); showToast(existing ? "Goal updated." : "Goal created.");
      }

      function previewContribution(form) {
        clearFormErrors(form);
        const goalId = form.elements.contributionGoalId.value;
        const label = form.elements.contributionLabel.value.trim();
        const amountCents = parseMoney(form.elements.contributionAmount.value);
        const nextDate = form.elements.contributionDate.value;
        let valid = true;
        if (!label || label.length > 80) { showFieldError("contributionLabel", "Use a label between 1 and 80 characters."); valid = false; }
        if (amountCents === null || amountCents <= 0) { showFieldError("contributionAmount", "Enter an amount greater than zero."); valid = false; }
        if (!validCalendarDate(nextDate)) { showFieldError("contributionDate", "Choose a valid date."); valid = false; }
        if (!valid) return;
        state.contributionPreview = { goalId, editingId: state.contributionEditor.id || null, contribution: { id: state.contributionEditor.id || createId("contribution"), label, amountCents, nextDate, frequency: form.elements.contributionFrequency.value } };
        render();
      }

      function commitContribution() {
        const preview = state.contributionPreview;
        if (!preview) return;
        const goal = state.plan.goals.find(item => item.id === preview.goalId);
        if (!goal) return;
        const index = preview.editingId ? goal.contributions.findIndex(item => item.id === preview.editingId) : -1;
        if (index >= 0) goal.contributions[index] = preview.contribution; else goal.contributions.push(preview.contribution);
        state.contributionEditor = null;
        state.contributionPreview = null;
        markDirty(); render(); showToast(index >= 0 ? "Contribution schedule updated." : "Contributions added to your plan.");
      }

      async function removeContribution(goalId, contributionId, trigger = null) {
        const goal = state.plan.goals.find(item => item.id === goalId);
        const entry = goal && goal.contributions.find(item => item.id === contributionId);
        if (!entry || !await requestDecision({ title: "Delete this contribution?", message: 'Delete the contribution schedule "' + entry.label + '"? Linked Decision Lab changes will also be removed.', confirmLabel: "Delete contribution", trigger })) return;
        goal.contributions = goal.contributions.filter(item => item.id !== contributionId);
        state.plan.scenarios.forEach(scenario => scenario.changes = scenario.changes.filter(change => !(change.type === "contribution-change" && change.sourceId === contributionId)));
        state.scenarioDraft = null;
        markDirty(); render(); showToast("Contribution schedule deleted.");
      }

      async function removeGoal(id, trigger = null) {
        const goal = state.plan.goals.find(item => item.id === id);
        if (!goal) return;
        const copy = goal.contributions.length ? " This also removes its planned transfers and linked Decision Lab changes." : "";
        if (!await requestDecision({ title: "Delete this goal?", message: 'Delete the goal "' + goal.name + '"?' + copy, confirmLabel: "Delete goal", trigger })) return;
        const contributionIds = new Set(goal.contributions.map(item => item.id));
        state.plan.goals = state.plan.goals.filter(item => item.id !== id);
        state.plan.scenarios.forEach(scenario => scenario.changes = scenario.changes.filter(change => !(change.type === "contribution-change" && (change.goalId === id || contributionIds.has(change.sourceId)))));
        state.scenarioDraft = null;
        markDirty(); render(); showToast("Goal and its planned transfers deleted.");
      }

      function savePlanFile() {
        if (state.scenarioDraftDirty) { showToast("Save or discard the active scenario changes before downloading your plan.", true); return; }
        const result = validatePlan(state.plan);
        if (!result.valid) { showToast("This plan could not be saved because it is invalid.", true); return; }
        const payload = JSON.stringify(state.plan, null, 2);
        const blob = new Blob([payload], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const date = state.plan.planningStartDate || todayISO();
        link.href = url;
        link.download = "bluegrass-bloom-plan-" + date + ".json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        state.planDirty = false;
        state.dirty = false;
        saveLocal();
        render();
        showToast("Plan downloaded as a JSON file.");
      }

      function openPlanFile(file) {
        if (!file) return;
        clearFileFeedback();
        if (file.size > 1024 * 1024) { showFileFeedback("That file is too large to be a Bluegrass Bloom plan. Current work was kept."); return; }
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            const result = validatePlan(parsed);
            if (!result.valid) throw new Error(result.errors[0]);
            if (!await confirmReplace("Opening this plan", lastOpenTrigger)) return;
            state.plan = normalizePlan(parsed);
            delete state.plan.demoStory;
            state.plan.demo = false;
            state.planDirty = false;
            state.scenarioDraft = null;
            state.scenarioDraftBaseline = null;
            state.scenarioDraftDirty = false;
            state.activeScenarioId = null;
            resetTransientEditors();
            state.dirty = false;
            state.screen = "app";
            state.view = "overview";
            saveLocal();
            render();
            showToast("Plan opened successfully.");
          } catch (error) {
            showFileFeedback("Plan not opened: " + (error.message || "invalid JSON file") + " Current work was kept.");
          } finally {
            fileInput.value = "";
          }
        };
        reader.onerror = () => { showFileFeedback("The file could not be read. Current work was kept."); fileInput.value = ""; };
        reader.readAsText(file);
      }

      async function switchScenario(id, trigger = null) {
        if (state.scenarioDraftDirty && !await requestDecision({ title: "Discard draft changes?", message: "Switching scenarios will discard the active draft changes.", confirmLabel: "Discard and switch", trigger })) return;
        const scenario = state.plan.scenarios.find(item => item.id === id);
        if (!scenario) return;
        state.activeScenarioId = scenario.id;
        state.scenarioDraft = clonePlan(scenario);
        state.scenarioDraftBaseline = clonePlan(scenario);
        state.scenarioDraftDirty = false;
        state.scenarioEditingChangeId = null;
        refreshDirtyState();
        render();
      }

      async function handleScenarioAction(action, trigger = null) {
        ensureScenarioDraft();
        if (action === "new") {
          if (state.scenarioDraftDirty && !await requestDecision({ title: "Discard draft changes?", message: "Starting a new scenario will discard the active draft changes.", confirmLabel: "Discard and start", trigger })) return;
          if (state.plan.scenarios.length >= 3) { showToast("You can save up to three scenarios. Delete one before starting another.", true); return; }
          state.activeScenarioId = null;
          state.scenarioDraft = emptyScenario("New decision");
          state.scenarioDraftBaseline = clonePlan(state.scenarioDraft);
          state.scenarioDraftDirty = false;
          state.scenarioEditingChangeId = null;
          refreshDirtyState();
          render();
        } else if (action === "discard") {
          state.scenarioDraft = clonePlan(state.scenarioDraftBaseline);
          state.scenarioDraftDirty = false;
          state.scenarioEditingChangeId = null;
          refreshDirtyState();
          render();
          showToast("Draft changes discarded. The original comparison is restored.");
        } else if (action === "delete") {
          if (!state.activeScenarioId || !await requestDecision({ title: "Delete this scenario?", message: "Delete this saved scenario? Your baseline money plan will not change.", confirmLabel: "Delete scenario", trigger })) return;
          const index = state.plan.scenarios.findIndex(scenario => scenario.id === state.activeScenarioId);
          if (index >= 0) state.plan.scenarios.splice(index, 1);
          const next = state.plan.scenarios[0] || null;
          state.activeScenarioId = next ? next.id : null;
          state.scenarioDraft = next ? clonePlan(next) : emptyScenario();
          state.scenarioDraftBaseline = clonePlan(state.scenarioDraft);
          state.scenarioDraftDirty = false;
          state.scenarioEditingChangeId = null;
          markDirty();
          render();
          showToast("Scenario deleted. Your money plan was not changed.");
        }
      }

      async function handleAction(action, trigger = null) {
        if (action === "create-plan") {
          if (!await confirmReplace("Creating a new plan", trigger)) return;
          state.plan = emptyPlan();
          state.screen = "onboarding";
          state.onboardingStep = 1;
          state.dirty = true;
          state.planDirty = true;
          state.scenarioDraft = null;
          state.scenarioDraftDirty = false;
          resetTransientEditors();
          saveLocal();
          render();
        } else if (action === "load-demo") {
          if (!await confirmReplace("Loading the fictional demo", trigger)) return;
          state.plan = demoPlan(state.plan ? state.plan.planningStartDate : todayISO());
          const demoScenario = state.plan.scenarios[0];
          state.screen = "app";
          state.view = "lab";
          state.forecastHorizon = 30;
          state.forecastIncomeMode = "expected";
          state.dirty = true;
          state.planDirty = true;
          state.activeScenarioId = demoScenario.id;
          state.scenarioDraft = clonePlan(demoScenario);
          state.scenarioDraftBaseline = clonePlan(demoScenario);
          state.scenarioDraftDirty = false;
          resetTransientEditors();
          saveLocal();
          render();
          showToast("Fictional UK student demo loaded in the Decision Lab.");
        } else if (action === "save-plan") savePlanFile();
        else if (action === "open-plan") {
          lastOpenTrigger = trigger;
          clearFileFeedback();
          fileInput.click();
        }
        else if (action === "reset-plan") {
          if (!await requestDecision({ title: "Reset Bluegrass Bloom?", message: "This clears the current plan from this browser and returns to the welcome screen.", confirmLabel: "Reset plan", trigger })) return;
          state.plan = null;
          state.dirty = false;
          state.planDirty = false;
          state.scenarioDraft = null;
          state.scenarioDraftDirty = false;
          resetTransientEditors();
          state.screen = "welcome";
          state.view = "overview";
          try { localStorage.removeItem(STORAGE_KEY); } catch (_) { storageAvailable = false; }
          render();
        } else if (action === "cancel-onboarding") {
          if (!await confirmReplace("Canceling setup", trigger)) return;
          state.plan = null;
          state.dirty = false;
          state.planDirty = false;
          state.scenarioDraft = null;
          state.scenarioDraftDirty = false;
          resetTransientEditors();
          state.screen = "welcome";
          try { localStorage.removeItem(STORAGE_KEY); } catch (_) { storageAvailable = false; }
          render();
        } else if (action === "onboard-next") {
          if (state.onboardingStep === 1 && !readBasics(document.getElementById("onboarding-form"))) return;
          state.onboardingStep += 1;
          render();
          window.scrollTo(0, 0);
        } else if (action === "onboard-back") {
          state.onboardingStep -= 1;
          render();
          window.scrollTo(0, 0);
        } else if (action === "finish-onboarding") {
          if (!readGoal(document.getElementById("onboarding-form"))) return;
          state.screen = "app";
          state.view = "overview";
          saveLocal();
          render();
        }
      }

      app.addEventListener("click", event => {
        const actionTarget = event.target.closest("[data-action]");
        if (actionTarget) { void handleAction(actionTarget.dataset.action, actionTarget); return; }
        const viewTarget = event.target.closest("[data-view]");
        if (viewTarget) { state.view = viewTarget.dataset.view; render(); window.scrollTo(0, 0); return; }
        const addTarget = event.target.closest("[data-add]");
        if (addTarget) { openEntryDialog(addTarget.dataset.add); return; }
        const editTarget = event.target.closest("[data-edit]");
        if (editTarget) { openEntryDialog(editTarget.dataset.edit, editTarget.dataset.id); return; }
        const deleteTarget = event.target.closest("[data-delete]");
        if (deleteTarget) { void deleteEntry(deleteTarget.dataset.delete, deleteTarget.dataset.id, deleteTarget); return; }
        const editContributionTarget = event.target.closest("[data-edit-contribution]");
        if (editContributionTarget) {
          const [goalId, id] = editContributionTarget.dataset.editContribution.split("|");
          state.view = "goals"; state.contributionEditor = { goalId, id }; state.contributionPreview = null; render(); window.scrollTo(0, 0); return;
        }
        const goalNew = event.target.closest("[data-goal-new]");
        if (goalNew) { state.goalEditorId = "new"; state.contributionEditor = null; state.contributionPreview = null; render(); return; }
        const goalEdit = event.target.closest("[data-goal-edit]");
        if (goalEdit) { state.goalEditorId = goalEdit.dataset.goalEdit; state.contributionEditor = null; state.contributionPreview = null; render(); return; }
        const goalDelete = event.target.closest("[data-goal-delete]");
        if (goalDelete) { void removeGoal(goalDelete.dataset.goalDelete, goalDelete); return; }
        if (event.target.closest("[data-goal-cancel]")) { state.goalEditorId = null; render(); return; }
        const contributionNew = event.target.closest("[data-contribution-new]");
        if (contributionNew) { state.contributionEditor = { goalId: contributionNew.dataset.contributionNew, id: null }; state.contributionPreview = null; state.goalEditorId = null; render(); return; }
        const contributionEdit = event.target.closest("[data-contribution-edit]");
        if (contributionEdit) { const [goalId, id] = contributionEdit.dataset.contributionEdit.split("|"); state.contributionEditor = { goalId, id }; state.contributionPreview = null; state.goalEditorId = null; render(); return; }
        const contributionDelete = event.target.closest("[data-contribution-delete]");
        if (contributionDelete) { const [goalId, id] = contributionDelete.dataset.contributionDelete.split("|"); void removeContribution(goalId, id, contributionDelete); return; }
        if (event.target.closest("[data-contribution-cancel]")) { state.contributionEditor = null; state.contributionPreview = null; render(); return; }
        if (event.target.closest("[data-contribution-preview-cancel]")) { state.contributionPreview = null; render(); return; }
        if (event.target.closest("[data-contribution-commit]")) { commitContribution(); return; }
        if (event.target.closest("[data-demo-payday]")) { moveDemoPurchaseToPayday(); return; }
        if (event.target.closest("[data-shared-new]")) { state.sharedEditorId = "new"; render(); return; }
        const sharedEdit = event.target.closest("[data-shared-edit]");
        if (sharedEdit) { state.sharedEditorId = sharedEdit.dataset.sharedEdit; render(); return; }
        const sharedDelete = event.target.closest("[data-shared-delete]");
        if (sharedDelete) { void deleteSharedCost(sharedDelete.dataset.sharedDelete, sharedDelete); return; }
        const sharedLink = event.target.closest("[data-shared-link]");
        if (sharedLink) { const shared = state.plan.sharedCosts.find(item => item.id === sharedLink.dataset.sharedLink); if (shared) { linkSharedExpense(shared); markDirty(); render(); showToast("Your share was added to the plan and forecast."); } return; }
        if (event.target.closest("[data-shared-cancel]")) { state.sharedEditorId = null; render(); return; }
        const horizonTarget = event.target.closest("[data-horizon]");
        if (horizonTarget) {
          state.forecastHorizon = Number(horizonTarget.dataset.horizon);
          state.forecastInspectIndex = 0;
          state.labInspectIndex = 0;
          render();
          return;
        }
        const incomeModeTarget = event.target.closest("[data-income-mode]");
        if (incomeModeTarget) {
          state.forecastIncomeMode = incomeModeTarget.dataset.incomeMode;
          state.forecastInspectIndex = 0;
          state.labInspectIndex = 0;
          render();
          return;
        }
        const scenarioAction = event.target.closest("[data-scenario-action]");
        if (scenarioAction) { void handleScenarioAction(scenarioAction.dataset.scenarioAction, scenarioAction); return; }
        const scenarioSwitch = event.target.closest("[data-scenario-switch]");
        if (scenarioSwitch) { void switchScenario(scenarioSwitch.dataset.scenarioSwitch, scenarioSwitch); return; }
        const scenarioEdit = event.target.closest("[data-scenario-edit-change]");
        if (scenarioEdit) { state.scenarioEditingChangeId = scenarioEdit.dataset.scenarioEditChange; render(); return; }
        const scenarioRemove = event.target.closest("[data-scenario-remove-change]");
        if (scenarioRemove) {
          state.scenarioDraft.changes = state.scenarioDraft.changes.filter(change => change.id !== scenarioRemove.dataset.scenarioRemoveChange);
          if (state.scenarioEditingChangeId === scenarioRemove.dataset.scenarioRemoveChange) state.scenarioEditingChangeId = null;
          syncScenarioDraftDirty();
          render();
          return;
        }
        const scenarioReset = event.target.closest("[data-scenario-reset-change]");
        if (scenarioReset) {
          const baselineChange = state.scenarioDraftBaseline.changes.find(change => change.id === scenarioReset.dataset.scenarioResetChange);
          const index = state.scenarioDraft.changes.findIndex(change => change.id === scenarioReset.dataset.scenarioResetChange);
          if (baselineChange && index >= 0) state.scenarioDraft.changes[index] = clonePlan(baselineChange);
          else if (index >= 0) state.scenarioDraft.changes.splice(index, 1);
          state.scenarioEditingChangeId = null;
          syncScenarioDraftDirty();
          render();
          return;
        }
        const cancelScenarioEdit = event.target.closest("[data-scenario-cancel-edit]");
        if (cancelScenarioEdit) { state.scenarioEditingChangeId = null; render(); }
      });

      app.addEventListener("submit", event => {
        event.preventDefault();
        if (event.target.id === "plan-basics-form" && readBasics(event.target)) { render(); showToast("Basics updated."); }
        if (event.target.id === "goal-editor-form") saveGoalEditor(event.target);
        if (event.target.id === "contribution-form") previewContribution(event.target);
        if (event.target.id === "shared-form") saveSharedCost(event.target);
        if (event.target.id === "scenario-meta-form") saveScenarioDraft(event.target);
        if (["purchase-form", "paycheck-change-form", "paycheck-delay-form", "housing-change-form", "contribution-change-form"].includes(event.target.id)) saveScenarioChangeForm(event.target);
      });

      app.addEventListener("input", event => {
        if (!state.scenarioDraft) return;
        if (event.target.id === "scenarioName") {
          state.scenarioDraft.name = event.target.value;
          syncScenarioDraftDirty();
        }
      });

      app.addEventListener("change", event => {
        if (event.target.id === "sharedMode") {
          const peopleField = document.getElementById("sharedPeopleField");
          const shareField = document.getElementById("sharedShareField");
          if (peopleField) peopleField.hidden = event.target.value !== "equal";
          if (shareField) shareField.hidden = event.target.value !== "custom";
          if (event.target.value === "custom") {
            const shareInput = document.getElementById("sharedShare");
            if (shareInput) window.setTimeout(() => shareInput.focus(), 0);
          }
          return;
        }
        if (event.target.id === "scenarioReflection" && state.scenarioDraft) {
          state.scenarioDraft.reflection = event.target.value;
          syncScenarioDraftDirty();
          render();
        }
      });

      entryForm.addEventListener("submit", event => { event.preventDefault(); saveEntry(entryForm); });
      decisionCancel.addEventListener("click", () => settleDecision(false));
      decisionConfirm.addEventListener("click", () => settleDecision(true));
      decisionDialog.addEventListener("cancel", event => { event.preventDefault(); settleDecision(false); });
      decisionDialog.addEventListener("keydown", event => {
        if (event.key !== "Tab") return;
        const controls = [decisionCancel, decisionConfirm].filter(control => !control.disabled);
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      });
      decisionDialog.addEventListener("click", event => {
        if (event.target === decisionDialog) settleDecision(false);
      });
      dialog.addEventListener("click", event => {
        if (event.target.hasAttribute("data-close-dialog")) dialog.close();
        if (event.target === dialog) {
          const rect = dialog.getBoundingClientRect();
          if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
        }
      });
      fileInput.addEventListener("change", () => openPlanFile(fileInput.files[0]));
      window.addEventListener("beforeunload", event => {
        if (!state.dirty) return;
        event.preventDefault();
        event.returnValue = "";
      });

      loadLocal();
      render();
    })();
  </script>
</body>
</html>
